<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio e produtos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/estilo.css?v=11">
<style>
  #tab th.emp { border-left: 1px solid var(--borda); }
  #tab td.emp { border-left: 1px solid var(--borda); }
  @media (max-width: 860px) { #tab .so-largo { display: none; } }
</style>
</head>
<body>
<div class="tela">
  <div class="tela-cab"><h1>Cardápio e produtos</h1><span class="sub">O que se vende · custo vem da ficha técnica · preço e margem por empresa</span>
    <div class="dir"><span class="etiqueta exemplo" title="Dados fictícios: nada é gravado">exemplo</span>
      <button type="button" class="btn" id="btnExportar">Exportar</button>
      <button type="button" class="btn btn-pri" id="btnNovo">+ Novo produto</button></div></div>
  <div id="filtros"></div>
  <div class="abas-tela" id="abas"></div>
  <section class="kpis" id="kpis"></section>
  <section class="cartao"><div class="cartao-cab"><h2>Produtos</h2><span class="dir sub" id="contagem"></span></div>
    <div class="rolagem"><table class="tabela clicavel" id="tab"></table></div></section>
  <div class="form-nota" id="nota"></div>
</div>

<script src="../assets/js/menu.js?v=8"></script>
<script src="../assets/js/icones.js?v=1"></script>
<script src="../assets/js/tela.js?v=5"></script>
<script src="../assets/js/exemplo.js?v=7"></script>
<script src="../assets/js/cadastro.js?v=3"></script>
<script>
/* Regras (exemplo, números a confirmar com a Gran Sabor e o contador):
   - Custo = composição (fichas técnicas e insumos de revenda) + perda/sobra do buffet.
   - Cada empresa (CNPJ) tem o seu preço; imposto da venda depende da empresa.
   - Margem de contribuição = preço − custo − imposto − taxa do cartão.
   - CMV = custo ÷ preço. Acima da meta do grupo fica em vermelho. */
// Mesmos produtos de todas as abas; o custo é sempre calculado na hora (ficha + custo médio atual)
const produtos = PRODUTOS_VENDA;
const GRUPOS = ['Buffet', 'Marmitex', 'Bebidas', 'Sobremesas'];
const ABAS = [['todos', 'Todos'], ...GRUPOS.filter(g => produtos.some(p => p.grupo === g)).map(g => [g, g]), ['fora', 'Fora da meta']];
let aba = 'todos';
$('abas').innerHTML = ABAS.map(([k, n], i) => `<button type="button" data-aba="${k}"${i ? '' : ' class="ativa"'}>${n}</button>`).join('');
const filtro = barraFiltros($('filtros'), { aoMudar: desenhar, unidade: false, placeholder: 'Produto, código, grupo, preparo… (atalho: /)' });
const emps = () => filtro.empresa ? [filtro.empresa] : EMPRESAS.map(e => e.id);
const fora = p => emps().some(e => margemProduto(p, e).cmv > metaCMV(p));
const nomeComponente = c => c.tipo === 'ficha' ? (FICHAS.find(f => f.id === c.ref) || {}).nome : insumo(c.ref).nome;
const textoBusca = p => [p.nome, p.codigo, p.grupo, p.comp.map(nomeComponente).join(' '), ...emps().map(e => numero(p.precos[e], 2))].join(' ');
const porUn = p => p.un === 'kg' ? '/kg' : '';
const corCMV = (m, p) => m.cmv > metaCMV(p) ? 'desce' : 'sobe';

function visiveis() {
  return produtos.filter(p => casaBusca(textoBusca(p), filtro.busca) && (aba === 'todos' || (aba === 'fora' ? fora(p) : p.grupo === aba)));
}

function desenhar() {
  const v = visiveis(), es = emps(), uma = es.length === 1;
  const ms = v.flatMap(p => es.map(e => margemProduto(p, e)));
  $('kpis').innerHTML = [
    ['Produtos', v.length, `${new Set(v.map(p => p.grupo)).size} grupos`],
    ['CMV médio', pct(ms.length ? ms.reduce((a, m) => a + m.cmv, 0) / ms.length : 0), uma ? nomeEmpresa(es[0]) : 'média das 3 empresas'],
    ['Margem média', pct(ms.length ? ms.reduce((a, m) => a + m.pct, 0) / ms.length : 0), 'depois de imposto e cartão'],
    ['Fora da meta', `<span class="${v.filter(fora).length ? 'desce' : ''}">${v.filter(fora).length}</span>`, 'CMV acima do limite do grupo']
  ].map(([t, val, c]) => `<div class="kpi"><div class="kpi-tit">${t}</div><div class="kpi-valor">${val}</div><div class="kpi-ctx">${c}</div></div>`).join('');
  $('contagem').textContent = `${v.length} de ${produtos.length}`;
  let cab, linha, cols;
  if (uma) {
    const e = es[0]; cols = 9;
    cab = `<tr><th>Produto</th><th class="so-largo">Grupo</th><th class="num">Preço</th><th class="num">Custo</th><th class="num so-largo" title="Imposto da ${esc(nomeEmpresa(e))} (${numero(IMPOSTO_EMPRESA[e], 1)}%) + cartão (${numero(TAXA_CARTAO, 1)}%)">Imposto + cartão</th>
      <th class="num">Margem</th><th class="num">CMV</th><th class="num so-largo">Meta</th><th class="num so-largo" title="Preço para chegar exatamente na meta de CMV">Preço p/ meta</th></tr>`;
    linha = p => { const m = margemProduto(p, e);
      return `<tr data-id="${p.id}" tabindex="0"><td><b>${esc(p.nome)}</b> <small class="sub mono">${p.codigo}</small></td><td class="so-largo">${esc(p.grupo)}</td>
        <td class="num"><b>${reais(m.preco)}</b>${porUn(p)}</td><td class="num">${reais(m.custo)}</td><td class="num so-largo">${reais(m.desp)}</td>
        <td class="num">${reais(m.margem)} <small class="sub">${pct(m.pct)}</small></td><td class="num ${corCMV(m, p)}">${pct(m.cmv)}</td>
        <td class="num so-largo">${pct(metaCMV(p))}</td><td class="num so-largo">${m.cmv > metaCMV(p) ? reais(precoParaCMV(m.custo, metaCMV(p))) : '<span class="sub">ok</span>'}</td></tr>`; };
  } else {
    cols = 3 + es.length * 3;
    cab = `<tr><th rowspan="2">Produto</th><th rowspan="2" class="so-largo">Grupo</th><th rowspan="2" class="num">Custo</th>${es.map(e => `<th colspan="3" class="emp">${etqEmpresa(e)}</th>`).join('')}</tr>
      <tr>${es.map(() => `<th class="num emp">Preço</th><th class="num">Margem</th><th class="num">CMV</th>`).join('')}</tr>`;
    linha = p => `<tr data-id="${p.id}" tabindex="0"><td><b>${esc(p.nome)}</b> <small class="sub mono">${p.codigo}</small></td><td class="so-largo">${esc(p.grupo)}</td>
      <td class="num">${reais(custoProduto(p))}</td>${es.map(e => { const m = margemProduto(p, e);
        return `<td class="num emp"><b>${reais(m.preco)}</b>${porUn(p)}</td><td class="num">${pct(m.pct)}</td><td class="num ${corCMV(m, p)}">${pct(m.cmv)}</td>`; }).join('')}</tr>`;
  }
  const grupos = {}; v.forEach(p => (grupos[p.grupo] ||= []).push(p));
  $('tab').innerHTML = `<thead>${cab}</thead><tbody>${Object.entries(grupos).map(([g, ps]) =>
    `<tr class="grupo"><td colspan="${cols}">${esc(g)} <span class="sub">meta de CMV até ${pct(META_CMV[g] ?? 35)}</span></td></tr>${ps.map(linha).join('')}`).join('')
    || `<tr><td colspan="${cols}" class="vazio">${aba === 'fora' ? 'Todos os produtos estão dentro da meta. 👍' : 'Nada encontrado com esses filtros.'}</td></tr>`}</tbody>`;
  $('nota').textContent = `Imposto sobre a venda (exemplo): ${EMPRESAS.map(e => `${e.nome} ${numero(IMPOSTO_EMPRESA[e.id], 1)}%`).join(' · ')} · cartão ${numero(TAXA_CARTAO, 1)}%. `
    + 'Produtos por kg já incluem a perda/sobra do buffet no custo. Toda venda sai com NFC-e.';
}

/* ---------- Editar / novo produto (com simulador de preço) ---------- */
function editar(p) {
  const novo = !p; const foto = p ? JSON.parse(JSON.stringify(p)) : null; p = p || { id: 'p' + Date.now(), codigo: 'P' + String(produtos.length + 1).padStart(2, '0'), nome: '', grupo: 'Buffet', un: 'kg', perda: 0, comp: [{ tipo: 'ficha', ref: FICHAS[0].id, qtd: 1 }], precos: {}, ativo: true };
  const n = x => Number(String(x).replace(/\./g, '').replace(',', '.'));
  const opcoes = sel => `<optgroup label="Fichas técnicas">${FICHAS.map(f => `<option value="ficha:${f.id}"${sel === 'ficha:' + f.id ? ' selected' : ''}>${esc(f.nome)}</option>`).join('')}</optgroup>
    <optgroup label="Insumos (revenda/embalagem)">${INSUMOS.map(i => `<option value="insumo:${i.id}"${sel === 'insumo:' + i.id ? ' selected' : ''}>${esc(i.nome)}</option>`).join('')}</optgroup>`;
  const v = janela(novo ? 'Novo produto' : `Editar · ${p.nome}`, `
    <div class="form-grade">
      <label class="c6">Produto *<input name="nome" class="campo" maxlength="60" value="${esc(p.nome)}"></label>
      <label class="c2">Código<input name="codigo" class="campo" maxlength="10" value="${esc(p.codigo)}"></label>
      <label class="c2">Grupo<select name="grupo" class="campo">${GRUPOS.map(g => `<option${g === p.grupo ? ' selected' : ''}>${g}</option>`).join('')}</select></label>
      <label class="c2">Vende por<select name="un" class="campo"><option value="kg"${p.un === 'kg' ? ' selected' : ''}>kg</option><option value="un"${p.un === 'un' ? ' selected' : ''}>unidade</option></select></label>
    </div>
    <div class="sub-tit">Composição <span class="sub" id="dicaComp"></span></div>
    <table class="tabela"><thead><tr><th>Preparo ou insumo</th><th class="num" style="width:120px">Quantidade</th><th class="num">Custo</th><th></th></tr></thead><tbody id="comp"></tbody></table>
    <div class="form-grade"><div class="c6"><button type="button" class="btn btn-mini" id="mais">+ item</button></div>
      <label class="c6">Perda / sobra (%)<input name="perda" class="campo" inputmode="decimal" value="${numero(p.perda || 0, 1)}" title="Comida que sobra no buffet e é descartada"></label></div>
    <div class="sub-tit">Preço por empresa <span class="sub">meta de CMV do grupo: <b id="meta"></b></span></div>
    <table class="tabela"><thead><tr><th>Empresa</th><th class="num" style="width:120px">Preço</th><th class="num">Margem</th><th class="num">CMV</th><th class="num">Preço p/ meta</th></tr></thead><tbody id="precos">
    ${EMPRESAS.map(e => `<tr><td>${etqEmpresa(e.id)}</td><td><input class="campo" data-preco="${e.id}" inputmode="decimal" value="${p.precos[e.id] ? numero(p.precos[e.id], 2) : ''}"></td>
      <td class="num" data-m></td><td class="num" data-cmv></td><td class="num"><button type="button" class="btn btn-mini" data-sug="${e.id}" title="Usar o preço que dá exatamente a meta de CMV"></button></td></tr>`).join('')}</tbody></table>
    <div class="form-nota" id="custoTot"></div>`, 'Salvar', fm => {
    const comp = lerComp(fm);
    if (!fm.nome.value.trim()) return 'Informe o nome do produto.';
    if (!comp.length) return 'Inclua ao menos um item na composição.';
    const precos = {}; fm.querySelectorAll('[data-preco]').forEach(i => { const x = n(i.value); if (x > 0) precos[i.dataset.preco] = x; });
    if (!Object.keys(precos).length) return 'Informe o preço em ao menos uma empresa.';
    if (!novo) { const m = mudouDesde(foto, produtos.find(x => x.id === p.id), Object.keys(foto), 'Este produto'); if (m) return m; }
    Object.assign(p, { nome: fm.nome.value.trim(), codigo: fm.codigo.value.trim(), grupo: fm.grupo.value, un: fm.un.value, perda: n(fm.perda.value) || 0, comp, precos });
    if (novo) produtos.push(p); desenhar(); avisarMudanca('produtos');
  });
  const fm = v.querySelector('form');
  const lerComp = fm => [...fm.querySelectorAll('#comp tr')].map(tr => { const [tipo, ref] = tr.querySelector('select').value.split(':'); return { tipo, ref, qtd: n(tr.querySelector('input').value) }; }).filter(c => c.qtd > 0);
  const linha = c => { const tr = document.createElement('tr');
    tr.innerHTML = `<td><select class="campo">${opcoes(c.tipo + ':' + c.ref)}</select></td><td><input class="campo" inputmode="decimal" value="${c.qtd ? numero(c.qtd, 3) : ''}"></td>
      <td class="num" data-c></td><td><button type="button" class="btn btn-ico" aria-label="Tirar item" data-tirar>${icone('fechar')}</button></td>`;
    $('comp').appendChild(tr); };
  const calc = () => {
    const tmp = { ...p, grupo: fm.grupo.value, un: fm.un.value, perda: n(fm.perda.value) || 0, comp: lerComp(fm), precos: {} };
    fm.querySelectorAll('#comp tr').forEach(tr => { const [tipo, ref] = tr.querySelector('select').value.split(':'), q = n(tr.querySelector('input').value) || 0;
      tr.querySelector('[data-c]').textContent = reais(q * (tipo === 'ficha' ? custoFicha(FICHAS.find(f => f.id === ref)).kg : insumo(ref).custo)); });
    $('dicaComp').textContent = fm.un.value === 'kg' ? `· preparos em kg, somando 1 kg (agora ${numero(tmp.comp.filter(c => c.tipo === 'ficha').reduce((a, c) => a + c.qtd, 0), 3)} kg)` : '· preparos em kg por unidade vendida (0,150 = 150 g)';
    const custo = custoProduto(tmp), meta = metaCMV(tmp);
    $('meta').textContent = pct(meta);
    fm.querySelectorAll('#precos tr').forEach(tr => { const e = tr.querySelector('[data-preco]').dataset.preco; tmp.precos[e] = n(tr.querySelector('[data-preco]').value) || 0;
      const m = margemProduto(tmp, e); tr.querySelector('[data-m]').innerHTML = m.preco ? `${reais(m.margem)} <small class="sub">${pct(m.pct)}</small>` : '—';
      tr.querySelector('[data-cmv]').innerHTML = m.preco ? `<span class="${corCMV(m, tmp)}">${pct(m.cmv)}</span>` : '—';
      tr.querySelector('[data-sug]').textContent = reais(precoParaCMV(custo, meta)); });
    $('custoTot').textContent = `Custo por ${fm.un.value === 'kg' ? 'kg' : 'unidade'}: ${reais(custo)} (já com ${numero(tmp.perda, 1)}% de perda). Mexa no preço e veja a margem de cada empresa na hora.`;
  };
  p.comp.forEach(linha);
  $('mais').onclick = () => { linha({ tipo: 'ficha', ref: FICHAS[0].id }); calc(); };
  fm.addEventListener('input', calc); fm.addEventListener('change', calc);
  fm.addEventListener('click', e => {
    if (e.target.closest('[data-tirar]') && fm.querySelectorAll('#comp tr').length > 1) { e.target.closest('tr').remove(); calc(); }
    const s = e.target.closest('[data-sug]'); if (s) { const custo = custoProduto({ ...p, perda: n(fm.perda.value) || 0, comp: lerComp(fm) });
      // arredonda para cima no ,90
      const alvo = precoParaCMV(custo, metaCMV({ grupo: fm.grupo.value })); fm.querySelector(`[data-preco="${s.dataset.sug}"]`).value = numero(Math.ceil(alvo + 0.1) - 0.1, 2); calc(); }
  });
  calc();
}

$('abas').onclick = e => { const b = e.target.closest('[data-aba]'); if (!b) return; aba = b.dataset.aba;
  $('abas').querySelectorAll('button').forEach(x => x.classList.toggle('ativa', x === b)); desenhar(); };
$('tab').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) editar(produtos.find(p => p.id === tr.dataset.id)); };
$('tab').onkeydown = e => { if (e.key === 'Enter') e.target.closest('tr[data-id]')?.click(); };
$('btnNovo').onclick = () => editar();
$('btnExportar').onclick = () => exportarCSV('cardapio-margens', ['Código', 'Produto', 'Grupo', 'Vende por', 'Custo', 'Empresa', 'Preço', 'Imposto + cartão', 'Margem R$', 'Margem %', 'CMV %', 'Meta CMV %'],
  visiveis().flatMap(p => emps().map(e => { const m = margemProduto(p, e);
    return [p.codigo, p.nome, p.grupo, p.un, numero(m.custo, 2), nomeEmpresa(e), numero(m.preco, 2), numero(m.desp, 2), numero(m.margem, 2), numero(m.pct, 1), numero(m.cmv, 1), numero(metaCMV(p), 0)]; })));
// Ficha técnica ou custo de insumo mudou em outra aba: custo, margem e CMV se recalculam sozinhos
vigiarDados(['produtos', 'fichas', 'insumos'], desenhar);
desenhar();
</script>
</body>
</html>
