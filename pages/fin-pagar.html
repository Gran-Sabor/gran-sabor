<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas a pagar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/estilo.css?v=11">
</head>
<body>
<div class="tela">
  <div class="tela-cab"><h1>Contas a pagar</h1><span class="sub">Por vencimento · cada conta tem empresa, unidade, centro de custo e categoria</span>
    <div class="dir"><span class="etiqueta exemplo" id="etqExemplo" title="Dados fictícios: nada é gravado">exemplo</span>
      <button type="button" class="btn oculto" id="btnImportar" title="Planilha do fluxo de caixa (uma aba por loja): pagamentos e recebimentos">Importar fluxo de caixa</button>
      <input type="file" id="arqImportar" accept=".xlsx,.xls" class="oculto">
      <button type="button" class="btn" id="btnExportar">Exportar</button>
      <button type="button" class="btn btn-pri" id="btnNovo">+ Nova conta</button></div></div>
  <div id="filtros"></div>
  <div id="avisoBanco"></div>
  <div class="abas-tela" id="abas">
    <button type="button" data-aba="aberto" class="ativa">Em aberto</button><button type="button" data-aba="vencidas">Vencidas</button>
    <button type="button" data-aba="pagas">Pagas</button><button type="button" data-aba="todas">Todas</button></div>
  <section class="kpis" id="kpis"></section>
  <div class="grade-2 largo">
    <section class="cartao"><div class="cartao-cab"><h2>Contas</h2><span class="dir sub" id="contagem"></span></div>
      <div class="rolagem"><table class="tabela clicavel" id="tab"></table></div></section>
    <div class="coluna">
      <section class="cartao"><div class="cartao-cab"><h2 class="titResumo" data-t="Por empresa">Por empresa · em aberto</h2></div><div id="porEmpresa"></div></section>
      <section class="cartao"><div class="cartao-cab"><h2 class="titResumo" data-t="Por categoria">Por categoria · em aberto</h2></div><div id="porCategoria"></div></section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js?v=2"></script>
<script src="../assets/js/banco.js?v=1"></script>
<script src="../assets/js/menu.js?v=15"></script>
<script src="../assets/js/icones.js?v=1"></script>
<script src="../assets/js/tela.js?v=5"></script>
<script src="../assets/js/exemplo.js?v=11"></script>
<script src="../assets/js/cadastro.js?v=6"></script>
<script src="../assets/js/financeiro.js?v=3"></script>
<script>
/* Contas a pagar. Com o banco: lista da tabela contas_pagar (a mesma para todas as abas, ao vivo).
   Sem o banco: dados de exemplo. A tela nunca guarda cópia: a lista é refeita da origem a cada desenho. */
let REAL = false, lendo = false, aba = 'aberto';
const hoje = hojeISO();
const LIMITE = 400;   // linhas desenhadas de uma vez (o resto aparece filtrando)
// Linha do banco → conta da tela (empresa vem da unidade)
const daLinha = r => ({ id: r.id, favorecido: r.favorecido, documento: r.documento, categoria: r.categoria_id, unidade: FIN.codUnidade(r.unidade_id),
  unidadeId: r.unidade_id, empresa: FIN.empresaDaUnidade(r.unidade_id), valor: Number(r.valor), vencimento: r.vencimento, pagoEm: r.pago_em,
  valorPago: r.valor_pago == null ? null : Number(r.valor_pago), forma: r.forma, conta: r.conta_bancaria_id, origem: r.origem, obs: r.obs, atualizado_em: r.atualizado_em });
const contas = () => REAL ? FIN.L('contas_pagar').map(daLinha) : CONTAS_PAGAR;
const nomeCat = id => REAL ? FIN.nomeCategoria(id) : (CATEGORIAS.find(c => c.id === id) || {}).nome || id;
const grupoCat = id => REAL ? (FIN.categoria(id).grupo || '') : '';
const nomeCentro = id => (CENTROS.find(c => c.id === id) || {}).nome || '—';
const situacao = c => c.pagoEm ? 'paga' : c.vencimento < hoje ? 'vencida' : c.vencimento === hoje ? 'hoje' : 'aberta';
const ETQ = { paga: '<span class="etiqueta completa">paga</span>', vencida: '<span class="etiqueta perigo">vencida</span>', hoje: '<span class="etiqueta pendente">vence hoje</span>', aberta: '<span class="etiqueta">em aberto</span>' };
const nomeFav = c => c.favorecido ? `<b>${esc(c.favorecido)}</b>` : `<span class="sub" title="O fluxo de caixa não traz o fornecedor">fornecedor não informado</span>`;

const filtro = barraFiltros($('filtros'), { aoMudar: desenhar, periodo: true, placeholder: 'Fornecedor, documento, categoria, valor… (atalho: /)' });
// Período vale para o vencimento; vencidas aparecem mesmo antes do período
const noPeriodo = c => (!filtro.de || c.vencimento >= filtro.de || (!c.pagoEm && c.vencimento < hoje)) && (!filtro.ate || c.vencimento <= filtro.ate);
const textoBusca = c => [c.favorecido, c.documento, nomeCat(c.categoria), grupoCat(c.categoria), REAL ? FIN.nomeConta(c.conta) : nomeCentro(c.centro), nomeUnidade(c.unidade), nomeEmpresa(c.empresa), numero(c.valor, 2), dataBR(c.vencimento + 'T12:00')].join(' ');

function filtradas(todas = contas()) {
  return todas.filter(c => noFiltro(filtro, c) && noPeriodo(c) && casaBusca(textoBusca(c), filtro.busca))
    .filter(c => aba === 'todas' || (aba === 'pagas' ? c.pagoEm : aba === 'vencidas' ? situacao(c) === 'vencida' : !c.pagoEm))
    .sort((a, b) => aba === 'pagas' ? (b.pagoEm || '').localeCompare(a.pagoEm || '') : a.vencimento.localeCompare(b.vencimento));
}

function desenhar() {
  const todas = contas();
  const base = todas.filter(c => noFiltro(filtro, c) && casaBusca(textoBusca(c), filtro.busca));
  const abertas = base.filter(c => !c.pagoEm);
  const soma = l => l.reduce((a, c) => a + (c.pagoEm ? c.valorPago : c.valor), 0);
  const ate7 = diasDaqui(7), pagasPer = base.filter(c => c.pagoEm && noPeriodo(c));
  $('kpis').innerHTML = [
    ['Vence hoje', reais(soma(abertas.filter(c => c.vencimento === hoje))), `${abertas.filter(c => c.vencimento === hoje).length} conta(s)`],
    ['Vencidas', `<span class="${abertas.some(c => c.vencimento < hoje) ? 'desce' : ''}">${reais(soma(abertas.filter(c => c.vencimento < hoje)))}</span>`, `${abertas.filter(c => c.vencimento < hoje).length} conta(s) em atraso`],
    ['Próximos 7 dias', reais(soma(abertas.filter(c => c.vencimento > hoje && c.vencimento <= ate7))), 'sem contar hoje'],
    ['Total em aberto', reais(soma(abertas)), `${abertas.length} conta(s)`],
    ['Pago no período', reais(soma(pagasPer)), `${numero(pagasPer.length)} pagamento(s)`]
  ].map(([t, v, c]) => `<div class="kpi"><div class="kpi-tit">${t}</div><div class="kpi-valor">${v}</div><div class="kpi-ctx">${c}</div></div>`).join('');

  const v = filtradas(todas), mostra = v.slice(0, LIMITE);
  $('contagem').textContent = `${numero(v.length)} conta(s) · ${reais(v.reduce((a, c) => a + c.valor, 0))}`;
  const vazio = lendo ? 'Lendo o banco…' : REAL && !todas.length ? 'Nenhuma conta no banco ainda. Clique em <b>Importar fluxo de caixa</b> ou em <b>+ Nova conta</b>.' : 'Nenhuma conta com esses filtros.';
  $('tab').innerHTML = `<thead><tr><th>Vencimento</th><th>Favorecido · documento</th><th>Categoria</th><th>Empresa · unidade</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead>
  <tbody>${mostra.map(c => `<tr data-id="${c.id}" tabindex="0">
    <td class="mono">${dataBR(c.vencimento + 'T12:00')}</td><td>${nomeFav(c)}<small class="sub"> ${esc(c.documento)}</small></td>
    <td title="${REAL ? 'Grupo: ' + esc(grupoCat(c.categoria)) : 'Centro de custo: ' + esc(nomeCentro(c.centro))}">${esc(nomeCat(c.categoria))}</td>
    <td>${etqEmpresa(c.empresa)} <small class="sub">${esc(nomeUnidade(c.unidade))}</small></td>
    <td class="num">${reais(c.valor)}</td><td>${ETQ[situacao(c)]}</td>
    <td>${c.pagoEm ? `<small class="sub">${dataBR(c.pagoEm + 'T12:00')}</small>` : '<button type="button" class="btn btn-mini" data-baixar>Pagar</button>'}</td></tr>`).join('')
    || `<tr><td colspan="7" class="vazio">${vazio}</td></tr>`}
    ${v.length > LIMITE ? `<tr><td colspan="7" class="vazio">Mostrando ${LIMITE} de ${numero(v.length)}. Use o período, a unidade ou a busca para ver o resto (o Exportar leva todas).</td></tr>` : ''}</tbody>`;

  // Resumos laterais (sempre separados por empresa) · em aberto; sem nada em aberto, mostra o pago no período
  const ref = abertas.length ? abertas : pagasPer;
  document.querySelectorAll('.titResumo').forEach(h => { h.textContent = h.dataset.t + (abertas.length ? ' · em aberto' : ' · pago no período'); });
  const total = soma(ref) || 1;
  $('porEmpresa').innerHTML = EMPRESAS.map(e => { const ls = ref.filter(c => c.empresa === e.id), val = soma(ls);
    return `<div class="lista-linha"><div>${etqEmpresa(e.id)}<small>${numero(ls.length)} conta(s)</small></div>
      <div class="barra" style="flex:1"><i style="width:${(val / total * 100).toFixed(1)}%;background:${e.cor}"></i></div><span class="dir">${reais(val)}</span></div>`; }).join('');
  const porCat = {}; ref.forEach(c => porCat[c.categoria] = (porCat[c.categoria] || 0) + (c.pagoEm ? c.valorPago : c.valor));
  $('porCategoria').innerHTML = Object.entries(porCat).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, val]) =>
    `<div class="lista-linha"><div>${esc(nomeCat(k))}</div><span class="dir">${reais(val)}</span></div>`).join('') || '<div class="vazio">Nada no período.</div>';
}

const n = x => FIN.num(x) || 0;
// Contas de saída: as da mesma empresa da conta (ou do grupo, sem unidade)
const contasSaida = c => FIN.contas().filter(k => k.ativo && (!k.unidade_id || FIN.empresaDaUnidade(k.unidade_id) === c.empresa));

/* ---------- Pagar (baixa) ---------- */
function baixar(c) {
  const foto = { ...c };
  const v = janela(`Pagar · ${c.favorecido || nomeCat(c.categoria)}`, `
    <div class="form-grade">
      <label class="c4">Data do pagamento<input name="data" type="date" class="campo" value="${hoje}"></label>
      <label class="c4">Valor da conta<input class="campo" value="${numero(c.valor, 2)}" readonly></label>
      <label class="c4">Juros / multa (R$)<input name="juros" class="campo" inputmode="decimal" value="${c.vencimento < hoje ? numero(c.valor * 0.02, 2) : '0,00'}"></label>
      <label class="c4">Desconto (R$)<input name="desc" class="campo" inputmode="decimal" value="0,00"></label>
      <label class="c4">Forma<select name="forma" class="campo"><option>Pix</option><option>Boleto</option><option>Transferência</option><option>Dinheiro</option><option>Cartão</option></select></label>
      <label class="c4">Conta de saída<select name="conta" class="campo">${REAL
        ? (contasSaida(c).map(k => `<option value="${k.id}">${esc(k.apelido)}</option>`).join('') || '<option value="">(cadastre em Contas bancárias)</option>')
        : EMPRESAS.map(e => `<option${e.id === c.empresa ? ' selected' : ''}>Banco · ${esc(e.nome)}</option>`).join('')}</select></label>
    </div><div class="form-nota" id="totalPago"></div>`, 'Confirmar pagamento', async f => {
    const valorPago = FIN.centavos(c.valor + n(f.juros.value) - n(f.desc.value));
    if (!(valorPago >= 0)) return 'Confira juros e desconto.';
    if (!REAL) {
      // Relê a conta na hora de pagar: se mudou (valor, vencimento, já paga) desde que a janela abriu, não paga
      const mudou = mudouDesde(foto, CONTAS_PAGAR.find(x => x.id === c.id), ['valor', 'vencimento', 'pagoEm', 'favorecido', 'empresa'], 'Esta conta');
      if (mudou) { desenhar(); return mudou; }
      Object.assign(c, { pagoEm: f.data.value, valorPago, forma: f.forma.value });
      desenhar(); avisarMudanca('contas_pagar'); return;
    }
    // Banco: só grava se a conta ainda for exatamente a que estava na tela (ninguém mexeu nela)
    const { data, error } = await db.from('contas_pagar').update({ pago_em: f.data.value, valor_pago: valorPago, forma: f.forma.value, conta_bancaria_id: f.conta.value || null })
      .eq('id', c.id).eq('atualizado_em', foto.atualizado_em).is('pago_em', null).select('id');
    if (error) return 'Não foi possível gravar: ' + error.message;
    if (!data.length) { FIN.gravou('contas_pagar').then(desenhar); return 'Esta conta mudou (ou já foi paga) enquanto a janela estava aberta. Nada foi feito: feche, confira o valor novo e confirme de novo.'; }
    await FIN.gravou('contas_pagar'); desenhar();
  });
  const f = v.querySelector('form');
  const tot = () => { v.querySelector('#totalPago').textContent = `Total pago: ${reais(c.valor + n(f.juros.value) - n(f.desc.value))}. A conta de saída é sempre da mesma empresa da conta.`; };
  f.addEventListener('input', tot); tot();
}

/* ---------- Nova conta (com parcelas) e edição ---------- */
function nova(c) {
  const ed = !!c; const foto = ed ? { ...c } : null;
  const unPadrao = filtro.unidade || 'loja1';
  c = c || { unidade: unPadrao, vencimento: diasDaqui(7), categoria: REAL ? '' : '3.03' };
  const cats = REAL ? FIN.categorias().filter(k => k.tipo === 'despesa' && (k.ativo || k.id === c.categoria)).sort((a, b) => a.codigo.localeCompare(b.codigo, 'pt-BR', { numeric: true }))
    : CATEGORIAS.filter(k => k.tipo === 'despesa');
  const uns = REAL ? FIN.unidades().filter(u => u.ativo !== false).map(u => ({ id: u.codigo, nome: u.nome })) : UNIDADES.filter(u => u.id !== 'todas');
  janela(ed ? 'Editar conta' : 'Nova conta a pagar', `
    <div class="form-grade">
      <label class="c6">Favorecido<input name="favorecido" class="campo" list="listaForn" value="${esc(c.favorecido)}"${REAL ? '' : ' required'}></label>
      <label class="c3">Documento<input name="documento" class="campo" value="${esc(c.documento)}" placeholder="NF, boleto…"></label>
      <label class="c3">Valor (R$)<input name="valor" class="campo" inputmode="decimal" value="${c.valor ? numero(c.valor, 2) : ''}"></label>
      <label class="c4">Unidade<select name="unidade" class="campo">${uns.map(u => `<option value="${u.id}"${u.id === c.unidade ? ' selected' : ''}>${esc(u.nome)} · ${esc(nomeEmpresa(UNIDADE_EMPRESA[u.id]))}</option>`).join('')}</select></label>
      ${REAL ? '' : '<label class="c4">Centro de custo<select name="centro" class="campo"></select></label>'}
      <label class="${REAL ? 'c8' : 'c4'}">Categoria *<select name="categoria" class="campo">${REAL ? '<option value="">Escolha a categoria…</option>' : ''}${cats.map(k => `<option value="${k.id}"${k.id === c.categoria ? ' selected' : ''}>${k.codigo} ${esc(REAL ? k.grupo + ' › ' + k.nome : k.nome)}</option>`).join('')}</select></label>
      <label class="c4">${ed ? 'Vencimento' : '1º vencimento'}<input name="vencimento" type="date" class="campo" value="${c.vencimento}"></label>
      ${ed ? '' : `<label class="c4">Parcelas<input name="parcelas" type="number" min="1" max="24" class="campo" value="1"></label>
      <label class="c4 marcar"><input name="recorrente" type="checkbox"> Repetir todo mês (12×)</label>`}
      ${REAL ? `<label class="c12">Observação<input name="obs" class="campo" maxlength="200" value="${esc(c.obs)}"></label>` : ''}
    </div><datalist id="listaForn">${FORNECEDORES.map(f => `<option value="${esc(f.nome)}">`).join('')}</datalist>
    <div class="form-nota">A empresa vem da unidade. Parcelas dividem o valor; "repetir" copia o valor cheio por 12 meses (aluguel, internet…).</div>`,
    'Salvar', async f => {
      const valor = FIN.centavos(n(f.valor.value));
      if ((!REAL && !f.favorecido.value.trim()) || !(valor > 0)) return REAL ? 'Informe o valor.' : 'Informe favorecido e valor.';
      if (!f.categoria.value) return 'Escolha a categoria: sem ela a conta não entra certo na DRE nem nos relatórios.';
      if (!REAL) {
        const dados = { favorecido: f.favorecido.value.trim(), documento: f.documento.value.trim(), unidade: f.unidade.value, empresa: UNIDADE_EMPRESA[f.unidade.value], centro: f.centro.value, categoria: f.categoria.value };
        if (ed) { const mudou = mudouDesde(foto, CONTAS_PAGAR.find(x => x.id === c.id), ['valor', 'vencimento', 'pagoEm', 'favorecido'], 'Esta conta'); if (mudou) return mudou;
          Object.assign(c, dados, { valor, vencimento: f.vencimento.value }); desenhar(); return avisarMudanca('contas_pagar'); }
        const rec = f.recorrente.checked, q = rec ? 12 : Math.max(1, +f.parcelas.value || 1);
        for (let i = 0; i < q; i++) {
          const d = new Date(f.vencimento.value + 'T12:00'); d.setMonth(d.getMonth() + i);
          CONTAS_PAGAR.push({ ...dados, id: 'n' + Date.now() + i, valor: rec ? valor : +(valor / q).toFixed(2), vencimento: d.toISOString().slice(0, 10), documento: dados.documento + (q > 1 ? ` ${i + 1}/${q}` : '') });
        }
        desenhar(); return avisarMudanca('contas_pagar');
      }
      const dados = { favorecido: f.favorecido.value.trim(), documento: f.documento.value.trim(), unidade_id: FIN.unidadePorCodigo(f.unidade.value).id,
        categoria_id: f.categoria.value, obs: f.obs.value.trim() };
      if (ed) {
        const { data, error } = await db.from('contas_pagar').update({ ...dados, valor, vencimento: f.vencimento.value })
          .eq('id', c.id).eq('atualizado_em', foto.atualizado_em).is('pago_em', null).select('id');
        if (error) return 'Não foi possível gravar: ' + error.message;
        if (!data.length) { FIN.gravou('contas_pagar').then(desenhar); return 'Esta conta mudou (ou foi paga) enquanto a janela estava aberta. Nada foi feito: feche e confira.'; }
        await FIN.gravou('contas_pagar'); desenhar(); return;
      }
      const rec = f.recorrente.checked, q = rec ? 12 : Math.max(1, +f.parcelas.value || 1);
      const parc = FIN.centavos(valor / q), linhas = [];
      for (let i = 0; i < q; i++) {
        const d = new Date(f.vencimento.value + 'T12:00'); d.setMonth(d.getMonth() + i);
        // a última parcela leva a diferença dos centavos
        linhas.push({ ...dados, valor: rec ? valor : (i === q - 1 ? FIN.centavos(valor - parc * (q - 1)) : parc), vencimento: d.toISOString().slice(0, 10), documento: dados.documento + (q > 1 ? ` ${i + 1}/${q}` : '') });
      }
      const { error } = await db.from('contas_pagar').insert(linhas);
      if (error) return 'Não foi possível gravar: ' + error.message;
      await FIN.gravou('contas_pagar'); desenhar();
    }, v => {
      const f = v.querySelector('form');
      if (!REAL) {
        const centros = () => { f.centro.innerHTML = CENTROS.filter(x => x.unidade === f.unidade.value).map(x => `<option value="${x.id}"${x.id === c.centro ? ' selected' : ''}>${esc(x.nome)}</option>`).join(''); };
        f.unidade.onchange = centros; centros();
      }
      f.favorecido.onchange = () => { const fo = FORNECEDORES.find(x => x.nome === f.favorecido.value); if (!fo || REAL) return;
        const cat = CATEGORIAS.find(k => k.tipo === 'despesa' && k.nome.toLowerCase().startsWith(fo.categoria.toLowerCase().slice(0, 5))); if (cat) f.categoria.value = cat.id; };
    });
}

const acharConta = id => contas().find(x => x.id === id);
$('btnNovo').onclick = () => nova();
$('abas').onclick = e => { const b = e.target.closest('[data-aba]'); if (!b) return; aba = b.dataset.aba; $('abas').querySelectorAll('button').forEach(x => x.classList.toggle('ativa', x === b)); desenhar(); };
$('tab').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (!tr) return; const c = acharConta(tr.dataset.id); if (!c) return;
  if (e.target.closest('[data-baixar]')) baixar(c); else if (!c.pagoEm) nova(c); });
$('tab').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.closest('tr[data-id]')?.click(); });
$('btnExportar').onclick = () => exportarCSV('contas-a-pagar', ['Vencimento', 'Favorecido', 'Documento', 'Categoria', REAL ? 'Grupo' : 'Centro de custo', 'Empresa', 'Unidade', 'Valor', 'Situação', 'Pago em', 'Valor pago'],
  filtradas().map(c => [dataBR(c.vencimento + 'T12:00'), c.favorecido, c.documento, nomeCat(c.categoria), REAL ? grupoCat(c.categoria) : nomeCentro(c.centro), nomeEmpresa(c.empresa), nomeUnidade(c.unidade), numero(c.valor, 2), situacao(c), c.pagoEm ? dataBR(c.pagoEm + 'T12:00') : '', c.valorPago != null ? numero(c.valorPago, 2) : '']));
$('btnImportar').onclick = () => $('arqImportar').click();
$('arqImportar').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) FIN.importarFluxo(f, msg => { $('avisoBanco').innerHTML = `<div class="aviso">${msg} Veja a aba <b>Pagas</b> (o período começa no mês atual: mude as datas para ver o ano).</div>`; desenhar(); }); };
// Conta nova vinda do XML, baixa feita em outra aba ou por outra pessoa (banco ao vivo): a lista se atualiza sozinha
vigiarDados(['contas_pagar', 'categorias', 'categorias_financeiras', 'contas_bancarias', 'unidades', 'centros', 'fornecedores'], desenhar);

(async () => {
  REAL = await FIN.usar();
  if (REAL) {
    janela.nota = 'Grava no banco';
    $('etqExemplo').classList.add('oculto'); $('btnImportar').classList.remove('oculto');
    $('kpis').innerHTML = '<div class="kpi"><div class="kpi-tit">Lendo o banco…</div></div>';
    lendo = true;
    try { await FIN.garantir('contas_pagar'); }
    catch (e) { $('avisoBanco').innerHTML = `<div class="aviso perigo">Não foi possível ler as contas: ${esc(e.message)}. Atualize a página.</div>`; }
    lendo = false;
  } else if (db) {
    $('avisoBanco').innerHTML = '<div class="aviso">As tabelas do financeiro ainda não estão no banco: as contas abaixo são de exemplo. Elas entram quando o pacote do financeiro for juntado (depois, tecla F5).</div>';
  }
  desenhar();
})();
</script>
