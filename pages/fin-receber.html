<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas a receber</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/estilo.css?v=11">
</head>
<body>
<div class="tela">
  <div class="tela-cab"><h1>Contas a receber</h1><span class="sub">Convênios PJ (consumo → fechamento → nota → boleto), cartões e repasses de delivery</span>
    <div class="dir"><span class="etiqueta exemplo" id="etqExemplo" title="Dados fictícios: nada é gravado">exemplo</span>
      <button type="button" class="btn oculto" id="btnImportar" title="Planilha do fluxo de caixa (uma aba por loja): recebimentos e pagamentos">Importar fluxo de caixa</button>
      <input type="file" id="arqImportar" accept=".xlsx,.xls" class="oculto">
      <button type="button" class="btn" id="btnExportar">Exportar</button></div></div>
  <div id="filtros"></div>
  <div id="avisoBanco"></div>
  <div class="abas-tela" id="abas"><button type="button" data-aba="rec" class="oculto">Recebimentos</button><button type="button" data-aba="pj" class="ativa">Faturamento PJ <small class="sub">exemplo</small></button><button type="button" data-aba="titulos">Títulos a receber <small class="sub">exemplo</small></button></div>
  <section class="kpis" id="kpis"></section>

  <div id="painelPJ" class="grade-2 largo">
    <section class="cartao"><div class="cartao-cab"><h2>Consumo em aberto · por convênio</h2><span class="dir sub">clique para ver as refeições</span></div>
      <div class="rolagem"><table class="tabela clicavel" id="tabConsumo"></table></div></section>
    <section class="cartao"><div class="cartao-cab"><h2>Fechamentos</h2><span class="dir sub">fechado › nota › boleto › pago</span></div>
      <div id="fechamentos"></div></section>
  </div>

  <div id="painelRec" class="grade-2 largo oculto">
    <section class="cartao"><div class="cartao-cab"><h2>Recebimentos</h2><span class="dir sub" id="contagemRec"></span></div>
      <div class="rolagem"><table class="tabela clicavel" id="tabRec"></table></div></section>
    <div class="coluna">
      <section class="cartao"><div class="cartao-cab"><h2>Por forma · no período</h2></div><div id="porForma"></div></section>
      <section class="cartao"><div class="cartao-cab"><h2>Por empresa · no período</h2></div><div id="porEmpresaRec"></div></section>
    </div>
  </div>

  <section id="painelTit" class="cartao oculto"><div class="cartao-cab"><h2>Títulos</h2><span class="dir sub" id="contagem"></span></div>
    <div class="rolagem"><table class="tabela" id="tabTit"></table></div></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js?v=2"></script>
<script src="../assets/js/banco.js?v=1"></script>
<script src="../assets/js/menu.js?v=10"></script>
<script src="../assets/js/icones.js?v=1"></script>
<script src="../assets/js/tela.js?v=5"></script>
<script src="../assets/js/exemplo.js?v=9"></script>
<script src="../assets/js/cadastro.js?v=5"></script>
<script src="../assets/js/financeiro.js?v=1"></script>
<script>
const hoje = hojeISO();
// Mesmos dados de todas as abas (o PDV lança consumo, o acerto entre empresas lança título): nada de cópia própria
const consumos = CONSUMOS_PJ, fechamentos = FECHAMENTOS_PJ, outros = RECEBER_OUTROS;
let aba = 'pj', proxNota = 2233;
const cli = id => CLIENTES_PJ.find(c => c.id === id) || {};
const ETAPAS = ['fechado', 'nota', 'boleto', 'pago'], NOME_ETAPA = { fechado: 'Fechado', nota: 'Nota emitida', boleto: 'Boleto enviado', pago: 'Pago' };

const filtro = barraFiltros($('filtros'), { aoMudar: desenhar, periodo: true, placeholder: 'Cliente, forma, CNPJ, NF, valor… (atalho: /)' });
const buscaCli = c => [c.nome, c.cnpj, fmtDoc(c.cnpj), nomeUnidade(c.unidade), nomeEmpresa(c.empresa)].join(' ');

// Títulos = boletos dos fechamentos + cartões/delivery
function titulos() {
  return [
    ...fechamentos.filter(f => f.etapa === 'boleto' || f.etapa === 'pago').map(f => ({ id: f.id, tipo: 'pj', origem: 'Boleto convênio', pagador: cli(f.cliente).nome, doc: cli(f.cliente).cnpj,
      empresa: f.empresa, unidade: f.unidade, vencimento: f.vencimento, valor: f.valor, recebidoEm: f.pagoEm || null, ref: f.nota })),
    ...outros.map(r => ({ ...r, tipo: 'outro', doc: '', ref: '' }))
  ].filter(t => noFiltro(filtro, t) && casaBusca([t.pagador, t.doc, fmtDoc(t.doc), t.origem, t.ref, nomeEmpresa(t.empresa), nomeUnidade(t.unidade), numero(t.valor, 2)].join(' '), filtro.busca))
   .sort((a, b) => a.vencimento.localeCompare(b.vencimento));
}

function desenhar() {
  $('painelPJ').classList.toggle('oculto', aba !== 'pj'); $('painelTit').classList.toggle('oculto', aba !== 'titulos'); $('painelRec').classList.toggle('oculto', aba !== 'rec');
  $('etqExemplo').classList.toggle('oculto', aba === 'rec');
  if (aba === 'rec') return desenharRec();
  const clientes = CLIENTES_PJ.filter(c => noFiltro(filtro, c) && casaBusca(buscaCli(c), filtro.busca));
  const ids = new Set(clientes.map(c => c.id));
  const abertos = consumos.filter(k => ids.has(k.cliente));
  const fech = fechamentos.filter(f => ids.has(f.cliente));
  const tit = titulos(), abertosTit = tit.filter(t => !t.recebidoEm);
  const soma = (l, k = 'valor') => l.reduce((a, x) => a + x[k], 0);

  $('kpis').innerHTML = (aba === 'pj' ? [
    ['Consumo em aberto', reais(soma(abertos)), `${numero(soma(abertos, 'refeicoes'))} refeições · ${clientes.length} convênio(s)`],
    ['Fechados sem nota', fech.filter(f => f.etapa === 'fechado').length, fech.some(f => f.etapa === 'fechado') ? '<span class="desce">emita a nota para cobrar</span>' : 'tudo em dia'],
    ['Boletos em aberto', reais(soma(fech.filter(f => f.etapa === 'boleto'))), `${fech.filter(f => f.etapa === 'boleto').length} boleto(s)`],
    ['Boletos vencidos', `<span class="${fech.some(f => f.etapa === 'boleto' && f.vencimento < hoje) ? 'desce' : ''}">${reais(soma(fech.filter(f => f.etapa === 'boleto' && f.vencimento < hoje)))}</span>`, 'cobrar o cliente']
  ] : [
    ['A receber hoje', reais(soma(abertosTit.filter(t => t.vencimento === hoje))), `${abertosTit.filter(t => t.vencimento === hoje).length} título(s)`],
    ['Vencidos', `<span class="${abertosTit.some(t => t.vencimento < hoje) ? 'desce' : ''}">${reais(soma(abertosTit.filter(t => t.vencimento < hoje)))}</span>`, `${abertosTit.filter(t => t.vencimento < hoje).length} título(s)`],
    ['Próximos 7 dias', reais(soma(abertosTit.filter(t => t.vencimento > hoje && t.vencimento <= diasDaqui(7)))), 'cartões, delivery e boletos'],
    ['Total a receber', reais(soma(abertosTit)), `${abertosTit.length} título(s)`],
    ...EMPRESAS.map(e => [e.nome, reais(soma(abertosTit.filter(t => t.empresa === e.id))), 'a receber'])
  ]).map(([t, v, c]) => `<div class="kpi"><div class="kpi-tit">${t}</div><div class="kpi-valor">${v}</div><div class="kpi-ctx">${c}</div></div>`).join('');

  // Consumo por convênio
  $('tabConsumo').innerHTML = `<thead><tr><th>Convênio</th><th>Empresa · unidade</th><th>Fechamento</th><th class="num">Refeições</th><th class="num">Valor</th><th>Limite</th><th></th></tr></thead><tbody>${
    clientes.map(c => { const ks = abertos.filter(k => k.cliente === c.id), val = soma(ks), uso = Math.min(100, val / c.limite * 100);
      return `<tr data-cli="${c.id}" tabindex="0"><td><b>${esc(c.nome)}</b><small class="sub"> ${fmtDoc(c.cnpj)}</small></td><td>${etqEmpresa(c.empresa)} <small class="sub">${esc(nomeUnidade(c.unidade))}</small></td>
        <td>${c.fechamento === 'quinzenal' ? 'Quinzenal' : 'Mensal'} · ${c.prazo} dias</td><td class="num">${numero(soma(ks, 'refeicoes'))}</td><td class="num">${reais(val)}</td>
        <td title="${pct(uso)} do limite de ${reais(c.limite)}"><div class="barra"><i style="width:${uso.toFixed(0)}%${uso > 85 ? ';background:var(--perigo)' : ''}"></i></div></td>
        <td>${ks.length ? '<button type="button" class="btn btn-mini" data-fechar-periodo>Fechar período</button>' : '<span class="sub">—</span>'}</td></tr>`; }).join('')
    || '<tr><td colspan="7" class="vazio">Nenhum convênio com esses filtros.</td></tr>'}</tbody>`;

  // Fechamentos com etapas
  $('fechamentos').innerHTML = fech.slice().sort((a, b) => ETAPAS.indexOf(a.etapa) - ETAPAS.indexOf(b.etapa)).map(f => {
    const i = ETAPAS.indexOf(f.etapa), venc = f.etapa === 'boleto' && f.vencimento < hoje;
    const acao = { fechado: 'Emitir nota', nota: 'Gerar boleto', boleto: 'Registrar pagamento' }[f.etapa];
    return `<div class="fech" data-f="${f.id}"><div class="fech-topo"><b>${esc(cli(f.cliente).nome)}</b>${etqEmpresa(f.empresa)}<span class="dir">${reais(f.valor)}</span></div>
      <small class="sub">${esc(f.periodo)} · ${numero(f.refeicoes)} refeições${f.nota ? ' · ' + esc(f.nota) : ''}${f.vencimento ? ` · vence ${dataBR(f.vencimento + 'T12:00')}` : ''}${venc ? ' · <b class="desce">vencido</b>' : ''}</small>
      <div class="etapas">${ETAPAS.map((e, k) => `<span class="${k <= i ? 'feita' : ''}">${NOME_ETAPA[e]}</span>`).join('')}${acao ? `<button type="button" class="btn btn-mini${f.etapa === 'fechado' ? ' btn-pri' : ''}" data-avancar>${acao}</button>` : ''}</div></div>`;
  }).join('') || '<div class="vazio">Nenhum fechamento com esses filtros.</div>';

  // Títulos
  $('contagem').textContent = `${tit.length} título(s) · ${reais(soma(tit))}`;
  $('tabTit').innerHTML = `<thead><tr><th>Vencimento</th><th>Pagador</th><th>Origem</th><th>Empresa · unidade</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>${
    tit.map(t => `<tr data-t="${t.id}"><td class="mono">${dataBR(t.vencimento + 'T12:00')}</td><td><b>${esc(t.pagador)}</b>${t.ref ? `<small class="sub"> ${esc(t.ref)}</small>` : ''}</td><td>${esc(t.origem)}</td>
      <td>${etqEmpresa(t.empresa)} <small class="sub">${esc(nomeUnidade(t.unidade))}</small></td><td class="num">${reais(t.valor)}${t.acerto ? `<br><small class="desce" title="${esc(t.acerto.motivo)}">acerto: era ${reais(t.acerto.de)}</small>` : ''}</td>
      <td>${t.recebidoEm ? '<span class="etiqueta completa">recebido</span>' : t.vencimento < hoje ? '<span class="etiqueta perigo">vencido</span>' : t.vencimento === hoje ? '<span class="etiqueta pendente">hoje</span>' : '<span class="etiqueta">a receber</span>'}</td>
      <td>${t.recebidoEm ? `<small class="sub">${dataBR(t.recebidoEm + 'T12:00')}</small>` : '<button type="button" class="btn btn-mini" data-receber>Receber</button>'}</td></tr>`).join('')
    || '<tr><td colspan="7" class="vazio">Nenhum título com esses filtros.</td></tr>'}</tbody>`;
}

/* ---------- Ações ---------- */
function verConsumo(c) {
  const ks = consumos.filter(k => k.cliente === c.id).sort((a, b) => a.data.localeCompare(b.data));
  janela(`${c.nome} · consumo em aberto`, `<div class="rolagem"><table class="tabela"><thead><tr><th>Data</th><th>Comanda</th><th class="num">Refeições</th><th class="num">Valor</th></tr></thead><tbody>${
    ks.map(k => `<tr><td>${dataBR(k.data + 'T12:00')}</td><td class="mono">${esc(k.comanda || k.nfce || '—')}</td><td class="num">${k.refeicoes}</td><td class="num">${reais(k.valor)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td></td><td class="num">${ks.reduce((a, k) => a + k.refeicoes, 0)}</td><td class="num">${reais(ks.reduce((a, k) => a + k.valor, 0))}</td></tr></tfoot></table></div>
    <div class="form-nota">Convênio não emite NFC-e na comanda: a NF-e do período sai no fechamento, junto com o boleto (sem faturar em dobro).</div>`, 'Fechar', () => {});
}
function fecharPeriodo(c) {
  const ks = consumos.filter(k => k.cliente === c.id);
  const valor = +ks.reduce((a, k) => a + k.valor, 0).toFixed(2), ref = ks.reduce((a, k) => a + k.refeicoes, 0);
  janela(`Fechar período · ${c.nome}`, `<p>Fechar <b>${numero(ref)} refeições</b> (${ks.length} cupons) no valor de <b>${reais(valor)}</b>?</p>
    <div class="form-nota">Depois de fechado, o consumo novo começa um período novo. O próximo passo é emitir a nota do fechamento e depois o boleto (vencimento em ${c.prazo} dias).</div>`,
    'Fechar período', () => {
      // Relê o consumo na hora: se entrou ou saiu cupom desde que a janela abriu, não fecha com o valor velho
      const agora = consumos.filter(k => k.cliente === c.id), vAgora = +agora.reduce((a, k) => a + k.valor, 0).toFixed(2);
      if (agora.length !== ks.length || vAgora !== valor) { desenhar(); return `O consumo mudou enquanto a janela estava aberta (agora ${agora.length} cupons, ${reais(vAgora)}). Nada foi fechado: feche e confira de novo.`; }
      for (let i = consumos.length - 1; i >= 0; i--) if (consumos[i].cliente === c.id) consumos.splice(i, 1);
      fechamentos.unshift({ id: 'fx' + Date.now(), cliente: c.id, empresa: c.empresa, unidade: c.unidade, periodo: `Até ${dataBR(hoje + 'T12:00')}`, valor, refeicoes: ref, etapa: 'fechado', nota: '', boleto: '', vencimento: '' });
      desenhar(); avisarMudanca('consumos_pj', 'fechamentos_pj');
    });
}
function avancar(f) {
  const c = cli(f.cliente), foto = { ...f };
  // Cada etapa confere se o fechamento continua igual ao que a pessoa está vendo (outra aba pode ter avançado ou mudado o valor)
  const conferir = fazer => fm => { const m = mudouDesde(foto, fechamentos.find(x => x.id === f.id), ['valor', 'etapa', 'cliente'], 'Este fechamento');
    if (m) { desenhar(); return m; } fazer(fm); desenhar(); avisarMudanca('fechamentos_pj'); };
  if (f.etapa === 'fechado') janela('Emitir nota do fechamento', `<p>${esc(c.nome)} · ${fmtDoc(c.cnpj)} · <b>${reais(f.valor)}</b></p>
      <div class="form-nota">As refeições do convênio não tiveram NFC-e na comanda: esta NF-e única do período é o documento fiscal delas
      (o contador confirma CFOP e tributação). Nunca fecha sem nota.</div>`, 'Emitir nota (simulação)', conferir(() => { f.etapa = 'nota'; f.nota = 'NF-e ' + proxNota++; }));
  else if (f.etapa === 'nota') janela('Gerar boleto', `<div class="form-grade"><label class="c4">Vencimento<input name="venc" type="date" class="campo" value="${diasDaqui(c.prazo)}"></label>
      <label class="c4">Valor<input class="campo" value="${numero(f.valor, 2)}" readonly></label><label class="c4">Banco<input class="campo" value="Banco · ${esc(nomeEmpresa(f.empresa))}" readonly></label></div>
      <div class="form-nota">O boleto sai pela conta da mesma empresa que vendeu. Envio por e-mail ao convênio junto com a nota e o extrato do consumo.</div>`,
      'Gerar boleto (simulação)', conferir(fm => { f.etapa = 'boleto'; f.vencimento = fm.venc.value; }));
  else if (f.etapa === 'boleto') janela('Registrar pagamento', `<div class="form-grade"><label class="c4">Recebido em<input name="data" type="date" class="campo" value="${hoje}"></label>
      <label class="c4">Valor<input class="campo" value="${numero(f.valor, 2)}" readonly></label></div>`, 'Confirmar', conferir(fm => { f.etapa = 'pago'; f.pagoEm = fm.data.value; }));
}

$('abas').onclick = e => { const b = e.target.closest('[data-aba]'); if (!b) return; aba = b.dataset.aba; $('abas').querySelectorAll('button').forEach(x => x.classList.toggle('ativa', x === b)); desenhar(); };
$('tabConsumo').addEventListener('click', e => { const tr = e.target.closest('tr[data-cli]'); if (!tr) return; const c = cli(tr.dataset.cli);
  if (e.target.closest('[data-fechar-periodo]')) fecharPeriodo(c); else verConsumo(c); });
$('fechamentos').addEventListener('click', e => { if (!e.target.closest('[data-avancar]')) return; avancar(fechamentos.find(f => f.id === e.target.closest('[data-f]').dataset.f)); });
$('tabTit').addEventListener('click', e => { if (!e.target.closest('[data-receber]')) return; const id = e.target.closest('tr').dataset.t;
  const f = fechamentos.find(x => x.id === id); if (f) return avancar(f);
  const r = outros.find(x => x.id === id), foto = { ...r }; janela(`Receber · ${r.pagador}`, `<div class="form-grade"><label class="c4">Recebido em<input name="data" type="date" class="campo" value="${hoje}"></label>
    <label class="c4">Valor<input name="valor" class="campo" value="${numero(r.valor, 2)}"></label></div><div class="form-nota">Diferença de valor (taxa do cartão ou do app) vai para a categoria "Taxas de cartão e apps".</div>`,
    'Confirmar', fm => { const m = mudouDesde(foto, outros.find(x => x.id === r.id), ['valor', 'recebidoEm'], 'Este título'); if (m) { desenhar(); return m; }
      r.recebidoEm = fm.data.value; desenhar(); avisarMudanca('receber_outros'); }); });
$('btnExportar').onclick = () => aba === 'rec' ? exportarRec() : aba === 'titulos'
  ? exportarCSV('titulos-a-receber', ['Vencimento', 'Pagador', 'Origem', 'Empresa', 'Unidade', 'Valor', 'Recebido em'], titulos().map(t => [dataBR(t.vencimento + 'T12:00'), t.pagador, t.origem, nomeEmpresa(t.empresa), nomeUnidade(t.unidade), numero(t.valor, 2), t.recebidoEm ? dataBR(t.recebidoEm + 'T12:00') : '']))
  : exportarCSV('fechamentos-pj', ['Cliente', 'CNPJ', 'Empresa', 'Período', 'Refeições', 'Valor', 'Etapa', 'Nota', 'Vencimento'], fechamentos.filter(f => noFiltro(filtro, f)).map(f => [cli(f.cliente).nome, fmtDoc(cli(f.cliente).cnpj), nomeEmpresa(f.empresa), f.periodo, f.refeicoes, numero(f.valor, 2), NOME_ETAPA[f.etapa], f.nota, f.vencimento ? dataBR(f.vencimento + 'T12:00') : '']));
vigiarDados(['consumos_pj', 'fechamentos_pj', 'receber_outros', 'clientes_pj', 'vendas', 'contas_receber', 'categorias_financeiras', 'contas_bancarias', 'extrato_lancamentos', 'unidades'], desenhar);

/* =====================================================================
   RECEBIMENTOS (banco · tabela contas_receber, ao vivo)
   Do fluxo de caixa vem só o valor RECEBIDO por dia, loja e forma (dinheiro, Pix,
   cartões, vales, fiado). O valor VENDIDO fica vazio até vir do PDV; dá para
   preencher à mão clicando na linha. A diferença vendido × recebido aparece quando os dois existem.
   ===================================================================== */
let REAL = false, lendo = false;
const LIMITE_REC = 400;
const recDaLinha = r => ({ id: r.id, unidade: FIN.codUnidade(r.unidade_id), empresa: FIN.empresaDaUnidade(r.unidade_id), forma: r.forma, cliente: r.cliente, documento: r.documento,
  vendido: r.valor_vendido == null ? null : Number(r.valor_vendido), valor: Number(r.valor), vencimento: r.vencimento, recebidoEm: r.recebido_em,
  recebido: r.valor_recebido == null ? null : Number(r.valor_recebido), conta: r.conta_bancaria_id, origem: r.origem, obs: r.obs, atualizado_em: r.atualizado_em });
const conciliadosRec = () => new Set(FIN.L('extrato_lancamentos').filter(x => x.conta_receber_id).map(x => x.conta_receber_id));
const dataRec = r => r.recebidoEm || r.vencimento;
const noPeriodoRec = r => (!filtro.de || dataRec(r) >= filtro.de || (!r.recebidoEm && r.vencimento < hoje)) && (!filtro.ate || dataRec(r) <= filtro.ate);
const buscaRec = r => [r.forma, r.cliente, r.documento, FIN.nomeConta(r.conta), nomeUnidade(r.unidade), nomeEmpresa(r.empresa), numero(r.valor, 2), dataBR(dataRec(r) + 'T12:00')].join(' ');
function recebimentos() {
  return FIN.L('contas_receber').map(recDaLinha).filter(r => noFiltro(filtro, r) && noPeriodoRec(r) && casaBusca(buscaRec(r), filtro.busca))
    .sort((a, b) => dataRec(b).localeCompare(dataRec(a)) || a.unidade.localeCompare(b.unidade) || a.forma.localeCompare(b.forma));
}
function desenharRec() {
  const v = recebimentos(), conc = conciliadosRec();
  const rec = v.filter(r => r.recebidoEm), abertos = v.filter(r => !r.recebidoEm), comVenda = rec.filter(r => r.vendido != null);
  const s = (l, k) => l.reduce((a, r) => a + (r[k] || 0), 0);
  const dias = new Set(rec.map(r => r.recebidoEm)).size || 1;
  $('kpis').innerHTML = [
    ['Recebido no período', reais(s(rec, 'recebido')), `${numero(rec.length)} lançamento(s) · ${numero(dias)} dia(s)`],
    ['Média por dia', reais(s(rec, 'recebido') / dias), 'recebido ÷ dias com recebimento'],
    ['Vendido no período', comVenda.length ? reais(s(comVenda, 'vendido')) : '<span class="sub">não informado</span>', comVenda.length ? `diferença ${reais(s(comVenda, 'vendido') - s(comVenda, 'recebido'))}` : 'o fluxo de caixa traz só o recebido'],
    ['A receber', reais(s(abertos, 'valor')), `${numero(abertos.length)} em aberto`],
    ['Conciliado no extrato', `${numero(rec.filter(r => conc.has(r.id)).length)} de ${numero(rec.length)}`, 'ligado a uma linha do extrato']
  ].map(([t, x, c]) => `<div class="kpi"><div class="kpi-tit">${t}</div><div class="kpi-valor">${x}</div><div class="kpi-ctx">${c}</div></div>`).join('');
  $('contagemRec').textContent = `${numero(v.length)} lançamento(s) · ${reais(s(rec, 'recebido') + s(abertos, 'valor'))}`;
  const vazio = lendo ? 'Lendo o banco…' : !FIN.L('contas_receber').length ? 'Nada no banco ainda. Clique em <b>Importar fluxo de caixa</b>.' : 'Nada com esses filtros (o período começa no mês atual).';
  $('tabRec').innerHTML = `<thead><tr><th>Data</th><th>Forma · origem</th><th>Empresa · unidade</th><th class="num">Vendido</th><th class="num">Recebido</th><th>Situação</th></tr></thead><tbody>${
    v.slice(0, LIMITE_REC).map(r => `<tr data-r="${r.id}" tabindex="0"><td class="mono">${dataBR(dataRec(r) + 'T12:00')}</td>
      <td><b>${esc(r.forma || '—')}</b><small class="sub"> ${esc(r.cliente || r.documento)}</small></td>
      <td>${etqEmpresa(r.empresa)} <small class="sub">${esc(nomeUnidade(r.unidade))}</small></td>
      <td class="num">${r.vendido == null ? '<span class="sub" title="O fluxo de caixa não traz o valor vendido">—</span>' : reais(r.vendido)}</td>
      <td class="num">${r.recebidoEm ? reais(r.recebido) : `<span class="sub">${reais(r.valor)}</span>`}</td>
      <td>${r.recebidoEm ? (conc.has(r.id) ? '<span class="etiqueta completa">conciliado</span>' : '<span class="etiqueta">recebido</span>') : r.vencimento < hoje ? '<span class="etiqueta perigo">vencido</span>' : '<span class="etiqueta pendente">a receber</span>'}</td></tr>`).join('')
    || `<tr><td colspan="6" class="vazio">${vazio}</td></tr>`}
    ${v.length > LIMITE_REC ? `<tr><td colspan="6" class="vazio">Mostrando ${LIMITE_REC} de ${numero(v.length)}. Use o período, a unidade ou a busca (o Exportar leva todos).</td></tr>` : ''}</tbody>`;
  const formas = {}; rec.forEach(r => formas[r.forma] = (formas[r.forma] || 0) + r.recebido);
  const tot = s(rec, 'recebido') || 1;
  $('porForma').innerHTML = Object.entries(formas).sort((a, b) => b[1] - a[1]).map(([f, x]) => `<div class="lista-linha"><div>${esc(f)}<small>${pct(x / tot * 100)}</small></div>
    <div class="barra" style="flex:1"><i style="width:${(x / tot * 100).toFixed(1)}%"></i></div><span class="dir">${reais(x)}</span></div>`).join('') || '<div class="vazio">Nada no período.</div>';
  $('porEmpresaRec').innerHTML = EMPRESAS.map(e => { const x = s(rec.filter(r => r.empresa === e.id), 'recebido');
    return `<div class="lista-linha"><div>${etqEmpresa(e.id)}</div><div class="barra" style="flex:1"><i style="width:${(x / tot * 100).toFixed(1)}%;background:${e.cor}"></i></div><span class="dir">${reais(x)}</span></div>`; }).join('');
}
function exportarRec() {
  exportarCSV('recebimentos', ['Data', 'Forma', 'Cliente/documento', 'Empresa', 'Unidade', 'Vendido', 'Recebido', 'A receber', 'Situação'],
    recebimentos().map(r => [dataBR(dataRec(r) + 'T12:00'), r.forma, r.cliente || r.documento, nomeEmpresa(r.empresa), nomeUnidade(r.unidade), r.vendido == null ? '' : numero(r.vendido, 2),
      r.recebidoEm ? numero(r.recebido, 2) : '', r.recebidoEm ? '' : numero(r.valor, 2), r.recebidoEm ? 'recebido' : 'a receber']));
}
// Clicar na linha: informar o valor vendido (quando vier do PDV/relatório) ou receber o que está em aberto
function editarRec(r) {
  const foto = { ...r }, nota = janela.nota; janela.nota = 'Grava no banco';
  setTimeout(() => { janela.nota = nota; });
  janela(`${r.forma} · ${nomeUnidade(r.unidade)} · ${dataBR(dataRec(r) + 'T12:00')}`, `
    <div class="form-grade">
      <label class="c4">Valor vendido (R$)<input name="vendido" class="campo" inputmode="decimal" value="${r.vendido == null ? '' : numero(r.vendido, 2)}" placeholder="não informado"></label>
      <label class="c4">${r.recebidoEm ? 'Recebido (R$)' : 'A receber (R$)'}<input class="campo" value="${numero(r.recebidoEm ? r.recebido : r.valor, 2)}" readonly></label>
      ${r.recebidoEm ? `<label class="c4">Recebido em<input class="campo" value="${dataBR(r.recebidoEm + 'T12:00')}" readonly></label>`
        : `<label class="c4">Receber em<input name="data" type="date" class="campo" value="${hoje}"></label>`}
      <label class="c12">Observação<input name="obs" class="campo" maxlength="200" value="${esc(r.obs)}"></label>
    </div><div class="form-nota">${r.origem === 'fluxo' ? 'Veio do fluxo de caixa: o valor recebido é o da planilha. ' : ''}A diferença entre vendido e recebido (taxa de cartão, vale, fiado) aparece nos indicadores.</div>`,
  r.recebidoEm ? 'Salvar' : 'Receber', async f => {
    const t = f.vendido.value.trim(), vendido = t === '' ? null : FIN.centavos(FIN.num(t));
    if (t !== '' && !(vendido >= 0)) return 'Valor vendido inválido.';
    const upd = { valor_vendido: vendido, obs: f.obs.value.trim() };
    if (!r.recebidoEm) Object.assign(upd, { recebido_em: f.data.value, valor_recebido: r.valor });
    const { data, error } = await db.from('contas_receber').update(upd).eq('id', r.id).eq('atualizado_em', foto.atualizado_em).select('id');
    if (error) return 'Não foi possível gravar: ' + error.message;
    if (!data.length) { FIN.gravou('contas_receber').then(desenhar); return 'Este lançamento mudou em outra tela enquanto a janela estava aberta. Nada foi feito: feche e confira o valor novo.'; }
    await FIN.gravou('contas_receber'); desenhar();
  });
}
$('tabRec').addEventListener('click', e => { const tr = e.target.closest('tr[data-r]'); if (!tr) return; const r = FIN.L('contas_receber').find(x => x.id === tr.dataset.r); if (r) editarRec(recDaLinha(r)); });
$('tabRec').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.closest('tr[data-r]')?.click(); });
$('btnImportar').onclick = () => $('arqImportar').click();
$('arqImportar').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) FIN.importarFluxo(f, msg => { $('avisoBanco').innerHTML = `<div class="aviso">${msg} O período começa no mês atual: mude as datas para ver o ano.</div>`; desenhar(); }); };

(async () => {
  REAL = await FIN.usar();
  if (REAL) {
    janela.nota = 'Exemplo: nada é gravado';   // convênio PJ ainda é exemplo; recebimentos gravam no banco
    $('etqExemplo').title = 'Faturamento PJ e títulos ainda são exemplo; Recebimentos vêm do banco';
    $('btnImportar').classList.remove('oculto');
    const b = $('abas').querySelector('[data-aba="rec"]'); b.classList.remove('oculto'); b.click();
    $('kpis').innerHTML = '<div class="kpi"><div class="kpi-tit">Lendo o banco…</div></div>';
    lendo = true;
    try { await FIN.garantir('contas_receber', 'extrato_lancamentos'); }
    catch (e) { $('avisoBanco').innerHTML = `<div class="aviso perigo">Não foi possível ler os recebimentos: ${esc(e.message)}. Atualize a página.</div>`; }
    lendo = false;
  }
  desenhar();
})();
</script>
</body>
