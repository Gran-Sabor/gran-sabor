<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faltas e atestados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/estilo.css?v=11">
<style>
  .tp { display: inline-block; min-width: 26px; text-align: center; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 1px 4px; }
  .tp.falta { background: var(--perigo); color: #fff; } .tp.atestado { background: #f6dfea; color: #8a2a5a; } .tp.abonada { background: #e3f1ea; color: #2f7d4f; }
</style>
</head>
<body>
<div class="tela">
  <div class="tela-cab"><h1>Faltas e atestados</h1><span class="sub">Faltas vêm da escala e descontam na folha · quem cobriu aparece ao lado</span>
    <div class="dir"><span class="etiqueta exemplo oculto" id="etqExemplo" title="Dados fictícios: nada é gravado">exemplo</span>
      <button type="button" class="btn" data-abrir="escala">Ver escala</button>
      <button type="button" class="btn" id="btnExportar">Exportar</button>
      <button type="button" class="btn" data-abrir="freelancers">Freelancers</button>
      <button type="button" class="btn btn-pri" id="btnNovo">+ Freelancer para cobrir</button></div></div>
  <div id="filtros"></div>
  <section class="kpis" id="kpis"></section>
  <div id="conteudo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js?v=2"></script>
<script src="../assets/js/banco.js?v=1"></script>
<script src="../assets/js/menu.js?v=10"></script>
<script src="../assets/js/icones.js?v=1"></script>
<script src="../assets/js/tela.js?v=5"></script>
<script src="../assets/js/exemplo.js?v=9"></script>
<script src="../assets/js/folha.js?v=3"></script>
<script src="../assets/js/escala.js?v=2"></script>
<script src="../assets/js/freelas.js?v=1"></script>
<script src="../assets/js/cadastro.js?v=5"></script>
<script>
/* Faltas: lidas da escala (escala.js), nunca digitadas aqui. O desconto mostrado é o mesmo do holerite (folha.js).
   Freelancers (cadastro, diárias, pagamento, custo) ficam na tela Freelancers (rh-freelancers.html).
   As 3 empresas sempre separadas: filtro, indicadores por empresa e agrupamento. */
janela.nota = ESC.REAL ? 'Grava no banco e aparece na hora nas outras telas' : 'Exemplo: as alterações somem ao recarregar';
$('etqExemplo').classList.toggle('oculto', ESC.REAL);
const filtro = barraFiltros($('filtros'), { aoMudar: desenhar, periodo: true, placeholder: 'Nome, cargo, motivo… (atalho: /)' });
const nomeCargo = c => CARGOS[c.cargo] || c.cargo;
const porEmpresa = (itens, valor) => EMPRESAS.map(e => `${e.nome.replace('Empresa ', 'E')}: ${valor(itens.filter(i => i.empresa === e.id))}`).join(' · ');

/* ---------- Faltas ---------- */
function faltas() {
  const de = filtro.de || '0000', ate = filtro.ate || '9999';
  return ESC.lista('escala_dias').filter(x => ['falta', 'atestado', 'abonada'].includes(x.tipo) && x.data >= de && x.data <= ate).map(x => {
    const c = COLABORADORES.find(y => y.id === x.colaborador_id); if (!c) return null;
    const r = ESC.dia(c, x.data); if (r.ex?.id !== x.id) return null;   // férias/afastamento por cima: não conta
    const cob = ESC.diarias().filter(d => d.cobre_colaborador_id === c.id && d.data === x.data && ESC.valeDiaria(d));
    return { x, c, empresa: c.empresa, unidade: c.unidade, desconto: x.tipo === 'falta' ? FOLHA.r2(c.salario / 30) : 0, cob };
  }).filter(Boolean).filter(i => noFiltro(filtro, i) && casaBusca([i.c.nome, nomeCargo(i.c), i.x.obs, ESC.NOME[i.x.tipo]].join(' '), filtro.busca))
    .sort((a, b) => b.x.data.localeCompare(a.x.data));
}
function abaFaltas() {
  const fs = faltas(), so = fs.filter(i => i.x.tipo === 'falta');
  const vezes = {}; so.forEach(i => vezes[i.c.id] = (vezes[i.c.id] || 0) + 1);
  const repetem = Object.entries(vezes).filter(([, n]) => n >= 2);
  $('kpis').innerHTML = kpis([
    ['Faltas (descontam)', `<span class="${so.length ? 'desce' : ''}">${so.length}</span>`, porEmpresa(so, l => l.length)],
    ['Atestados / abonadas', `${fs.filter(i => i.x.tipo === 'atestado').length} / ${fs.filter(i => i.x.tipo === 'abonada').length}`, 'não descontam'],
    ['Desconto do dia na folha', reais(so.reduce((a, i) => a + i.desconto, 0)), 'mais o DSR da semana, no holerite'],
    ['Faltaram 2 vezes ou mais', repetem.length, repetem.slice(0, 3).map(([id, n]) => `${colab(id).nome.split(' ')[0]} (${n})`).join(', ') || 'ninguém'],
    ['Cobertas por freelancer', fs.filter(i => i.cob.length).length, `de ${fs.length} ausência(s)`]
  ]);
  const grupos = EMPRESAS.map(e => [e, fs.filter(i => i.empresa === e.id)]).filter(([, l]) => l.length);
  return `<section class="cartao"><div class="rolagem"><table class="tabela"><thead><tr><th>Dia</th><th>Colaborador</th><th>Unidade</th><th>Tipo</th><th>Observação</th><th>Coberto por</th><th class="num">Desconto do dia</th></tr></thead><tbody>
    ${grupos.map(([e, l]) => `<tr class="grupo"><td colspan="7">${esc(e.nome)} <span class="sub">${l.length}</span></td></tr>` + l.map(i => `<tr>
      <td>${dataBR(i.x.data + 'T12:00')} <small class="sub">${ESC.SEM[ESC.dow(i.x.data)]}</small></td><td><b>${esc(i.c.nome)}</b> <small class="sub">${esc(nomeCargo(i.c))}</small></td>
      <td>${esc(nomeUnidade(i.unidade))}</td><td><span class="tp ${i.x.tipo}">${ESC.sigla({ tipo: i.x.tipo })}</span> ${esc(ESC.NOME[i.x.tipo])}</td><td>${esc(i.x.obs) || '<span class="sub">—</span>'}</td>
      <td>${i.cob.map(d => `★ ${esc(ESC.freelancer(d.freelancer_id).nome)}`).join(', ') || '<span class="sub">—</span>'}</td><td class="num">${i.desconto ? reais(i.desconto) : '<span class="sub">—</span>'}</td></tr>`).join('')).join('')
      || '<tr><td colspan="7" class="vazio">Nenhuma falta no período. Faltas são marcadas na tela Escala (clique no dia).</td></tr>'}</tbody></table></div></section>
    <div class="form-nota">Para marcar, trocar ou abonar uma falta, clique no dia na <a href="#" data-abrir="escala">Escala</a>. O holerite desconta sozinho.</div>`;
}

const kpis = l => l.map(([t, v, c]) => `<div class="kpi"><div class="kpi-tit">${t}</div><div class="kpi-valor">${v}</div><div class="kpi-ctx">${c || ''}</div></div>`).join('');
function desenhar() { $('conteudo').innerHTML = abaFaltas(); }
$('btnNovo').onclick = () => ESC.janelaDiaria(null, { unidade: filtro.unidade || 'loja1', motivo: 'falta' });
$('btnExportar').onclick = () => exportarCSV('faltas', ['Empresa', 'Unidade', 'Dia', 'Colaborador', 'Cargo', 'Tipo', 'Observação', 'Coberto por', 'Desconto do dia'],
  faltas().map(i => [nomeEmpresa(i.empresa), nomeUnidade(i.unidade), dataBR(i.x.data + 'T12:00'), i.c.nome, nomeCargo(i.c), ESC.NOME[i.x.tipo], i.x.obs, i.cob.map(d => ESC.freelancer(d.freelancer_id).nome).join(', '), numero(i.desconto, 2)]));
ESC.aoGravar = desenhar;
vigiarDados(['colaboradores', 'escala_dias', 'escala_padrao', 'escala_funcionamento', 'freelancers', 'freela_diarias', 'contas_pagar', 'ferias', 'unidades'], desenhar);
desenhar();
ESC.garantirPagar().then(desenhar).catch(e => console.warn('Contas a pagar:', e.message));
</script>
</body>
</html>
