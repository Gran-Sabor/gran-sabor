<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faltas e freelancers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/estilo.css?v=11">
<style>
  .tp { display: inline-block; min-width: 26px; text-align: center; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 1px 4px; }
  .tp.falta { background: var(--perigo); color: #fff; } .tp.atestado { background: #f6dfea; color: #8a2a5a; } .tp.abonada { background: #e3f1ea; color: #2f7d4f; }
</style>
</head>
<body>
<div class="tela">
  <div class="tela-cab"><h1>Faltas e freelancers</h1><span class="sub">Faltas vêm da escala e descontam na folha · diárias de freelancer viram conta a pagar</span>
    <div class="dir"><span class="etiqueta exemplo oculto" id="etqExemplo" title="Dados fictícios: nada é gravado">exemplo</span>
      <button type="button" class="btn" data-abrir="escala">Ver escala</button>
      <button type="button" class="btn" id="btnExportar">Exportar</button>
      <button type="button" class="btn btn-pri" id="btnNovo">+ Nova diária</button></div></div>
  <div id="filtros"></div>
  <div class="abas-tela" id="abas"><button type="button" data-aba="faltas" class="ativa">Faltas e atestados</button><button type="button" data-aba="diarias">Diárias de freelancer</button><button type="button" data-aba="cadastro">Cadastro de freelancers</button></div>
  <section class="kpis" id="kpis"></section>
  <div id="conteudo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js?v=2"></script>
<script src="../assets/js/banco.js?v=1"></script>
<script src="../assets/js/menu.js?v=15"></script>
<script src="../assets/js/icones.js?v=1"></script>
<script src="../assets/js/tela.js?v=5"></script>
<script src="../assets/js/exemplo.js?v=11"></script>
<script src="../assets/js/folha.js?v=3"></script>
<script src="../assets/js/escala.js?v=2"></script>
<script src="../assets/js/cadastro.js?v=6"></script>
<script>
/* Faltas: lidas da escala (escala.js), nunca digitadas aqui. O desconto mostrado é o mesmo do holerite (folha.js).
   Diárias: cada uma vira UMA conta a pagar (gerar de novo não duplica); depois de gerada, valor e dia ficam travados.
   As 3 empresas sempre separadas: filtro, indicadores por empresa e agrupamento. */
let aba = 'faltas';
janela.nota = ESC.REAL ? 'Grava no banco e aparece na hora nas outras telas' : 'Exemplo: as alterações somem ao recarregar';
$('etqExemplo').classList.toggle('oculto', ESC.REAL);
const filtro = barraFiltros($('filtros'), { aoMudar: desenhar, periodo: true, placeholder: 'Nome, cargo, motivo… (atalho: /)' });
const nomeCargo = c => CARGOS[c.cargo] || c.cargo;
const porEmpresa = (itens, valor) => EMPRESAS.map(e => `${e.nome.replace('Empresa ', 'E')}: ${valor(itens.filter(i => i.empresa === e.id))}`).join(' · ');

/* ---------- Faltas ---------- */
function faltas() {
  const de = filtro.de || '0000', ate = filtro.ate || '9999';
  return ESC.lista('escala_dias').filter(x => ['falta', 'atestado', 'abonada'].includes(x.tipo) && x.data >= de && x.data <= ate).map(x => {
    const c = COLABORADORES.find(y => y.id === x.colaborador_id); if (!c) return null;
    const r = ESC.dia(c, x.data); if (r.ex?.id !== x.id) return null;   // férias/afastamento por cima: não conta
    const cob = ESC.diarias().filter(d => d.cobre_colaborador_id === c.id && d.data === x.data && ESC.valeDiaria(d));
    return { x, c, empresa: c.empresa, unidade: c.unidade, desconto: x.tipo === 'falta' ? FOLHA.r2(c.salario / 30) : 0, cob };
  }).filter(Boolean).filter(i => noFiltro(filtro, i) && casaBusca([i.c.nome, nomeCargo(i.c), i.x.obs, ESC.NOME[i.x.tipo]].join(' '), filtro.busca))
    .sort((a, b) => b.x.data.localeCompare(a.x.data));
}
function abaFaltas() {
  const fs = faltas(), so = fs.filter(i => i.x.tipo === 'falta');
  const vezes = {}; so.forEach(i => vezes[i.c.id] = (vezes[i.c.id] || 0) + 1);
  const repetem = Object.entries(vezes).filter(([, n]) => n >= 2);
  $('kpis').innerHTML = kpis([
    ['Faltas (descontam)', `<span class="${so.length ? 'desce' : ''}">${so.length}</span>`, porEmpresa(so, l => l.length)],
    ['Atestados / abonadas', `${fs.filter(i => i.x.tipo === 'atestado').length} / ${fs.filter(i => i.x.tipo === 'abonada').length}`, 'não descontam'],
    ['Desconto do dia na folha', reais(so.reduce((a, i) => a + i.desconto, 0)), 'mais o DSR da semana, no holerite'],
    ['Faltaram 2 vezes ou mais', repetem.length, repetem.slice(0, 3).map(([id, n]) => `${colab(id).nome.split(' ')[0]} (${n})`).join(', ') || 'ninguém'],
    ['Cobertas por freelancer', fs.filter(i => i.cob.length).length, `de ${fs.length} ausência(s)`]
  ]);
  const grupos = EMPRESAS.map(e => [e, fs.filter(i => i.empresa === e.id)]).filter(([, l]) => l.length);
  return `<section class="cartao"><div class="rolagem"><table class="tabela"><thead><tr><th>Dia</th><th>Colaborador</th><th>Unidade</th><th>Tipo</th><th>Observação</th><th>Coberto por</th><th class="num">Desconto do dia</th></tr></thead><tbody>
    ${grupos.map(([e, l]) => `<tr class="grupo"><td colspan="7">${esc(e.nome)} <span class="sub">${l.length}</span></td></tr>` + l.map(i => `<tr>
      <td>${dataBR(i.x.data + 'T12:00')} <small class="sub">${ESC.SEM[ESC.dow(i.x.data)]}</small></td><td><b>${esc(i.c.nome)}</b> <small class="sub">${esc(nomeCargo(i.c))}</small></td>
      <td>${esc(nomeUnidade(i.unidade))}</td><td><span class="tp ${i.x.tipo}">${ESC.sigla({ tipo: i.x.tipo })}</span> ${esc(ESC.NOME[i.x.tipo])}</td><td>${esc(i.x.obs) || '<span class="sub">—</span>'}</td>
      <td>${i.cob.map(d => `★ ${esc(ESC.freelancer(d.freelancer_id).nome)}`).join(', ') || '<span class="sub">—</span>'}</td><td class="num">${i.desconto ? reais(i.desconto) : '<span class="sub">—</span>'}</td></tr>`).join('')).join('')
      || '<tr><td colspan="7" class="vazio">Nenhuma falta no período. Faltas são marcadas na tela Escala (clique no dia).</td></tr>'}</tbody></table></div></section>
    <div class="form-nota">Para marcar, trocar ou abonar uma falta, clique no dia na <a href="#" data-abrir="escala">Escala</a>. O holerite desconta sozinho.</div>`;
}

/* ---------- Diárias ---------- */
function diarias() {
  const de = filtro.de || '0000', ate = filtro.ate || '9999';
  return ESC.diarias().filter(x => x.data >= de && x.data <= ate).map(x => { const un = ESC.unCod(x.unidade_id), fl = ESC.freelancer(x.freelancer_id);
    return { x, un, empresa: UNIDADE_EMPRESA[un], unidade: un, fl, conta: ESC.contaDe(x), valor: Number(x.valor || 0) }; })
    .filter(i => noFiltro(filtro, i) && casaBusca([i.fl.nome, i.x.funcao, ESC.MOTIVOS[i.x.motivo], i.x.obs, i.x.cobre_colaborador_id ? colab(i.x.cobre_colaborador_id).nome : ''].join(' '), filtro.busca))
    .sort((a, b) => b.x.data.localeCompare(a.x.data));
}
const aPagar = l => l.filter(i => i.x.situacao === 'trabalhou' && !i.x.conta_pagar_id);
function abaDiarias() {
  const ds = diarias(), valem = ds.filter(i => ESC.valeDiaria(i.x)), soma = l => reais(l.reduce((a, i) => a + i.valor, 0));
  const sem = aPagar(ds), pagas = ds.filter(i => i.conta?.pago), abertas = ds.filter(i => i.conta && !i.conta.pago);
  $('kpis').innerHTML = kpis([
    ['Diárias no período', valem.length, porEmpresa(valem, l => l.length)],
    ['Valor das diárias', soma(valem), porEmpresa(valem, l => soma(l).replace('R$', '').trim())],
    ['Trabalhou, sem pagamento gerado', `<span class="${sem.length ? 'desce' : ''}">${sem.length}</span>`, soma(sem)],
    ['Em contas a pagar', abertas.length, soma(abertas)],
    ['Pagas', pagas.length, soma(pagas)]
  ]);
  const grupos = EMPRESAS.map(e => [e, ds.filter(i => i.empresa === e.id)]).filter(([, l]) => l.length);
  const pag = i => i.conta ? (i.conta.pago ? `<span class="etiqueta completa">pago ${ESC.dm(i.conta.pagoEm)}</span>` : `<span class="etiqueta pendente">a pagar ${ESC.dm(i.conta.vencimento)}</span>`)
      + (Math.abs(i.conta.valor - i.valor) >= 0.01 ? ` <span class="etiqueta perigo" title="A diária e a conta a pagar têm valores diferentes">dif. ${reais(i.valor - i.conta.valor)}</span>` : '')
    : i.x.conta_pagar_id ? '<span class="etiqueta pendente">conta apagada?</span>'
    : i.x.situacao === 'trabalhou' ? `<button type="button" class="btn btn-mini" data-pagar="${i.x.id}">Gerar pagamento</button>` : '<span class="sub">—</span>';
  return `${sem.length ? `<div class="aviso">${sem.length} diária(s) trabalhada(s) ainda sem pagamento (${soma(sem)}). <button type="button" class="btn btn-mini" data-pagartodas>Gerar pagamento de todas</button></div>` : ''}
    <section class="cartao"><div class="rolagem"><table class="tabela clicavel"><thead><tr><th>Dia</th><th>Unidade</th><th>Freelancer</th><th>Horário</th><th>Motivo</th><th class="num">Valor</th><th>Situação</th><th>Pagamento</th></tr></thead><tbody>
    ${grupos.map(([e, l]) => `<tr class="grupo"><td colspan="8">${esc(e.nome)} <span class="sub">${l.length} · ${soma(l.filter(i => ESC.valeDiaria(i.x)))}</span></td></tr>` + l.map(i => `<tr data-diaria="${i.x.id}" tabindex="0"${ESC.valeDiaria(i.x) ? '' : ' class="inativa"'}>
      <td>${dataBR(i.x.data + 'T12:00')} <small class="sub">${ESC.SEM[ESC.dow(i.x.data)]}</small></td><td>${esc(nomeUnidade(i.un))}</td><td><b>${esc(i.fl.nome)}</b> <small class="sub">${esc(i.x.funcao)}</small></td>
      <td>${ESC.hm(i.x.entrada)}–${ESC.hm(i.x.saida)}</td><td>${esc(ESC.MOTIVOS[i.x.motivo])}${i.x.cobre_colaborador_id ? ` <small class="sub">cobre ${esc(colab(i.x.cobre_colaborador_id).nome.split(' ')[0])}</small>` : ''}</td>
      <td class="num">${reais(i.valor)}</td><td>${esc(ESC.SITUACOES[i.x.situacao])}</td><td>${pag(i)}</td></tr>`).join('')).join('')
      || '<tr><td colspan="8" class="vazio">Nenhuma diária no período.</td></tr>'}</tbody></table></div></section>
    <div class="form-nota">Gerar pagamento cria a conta em Contas a pagar (unidade da diária, favorecido "Freelancer · nome", chave única por diária: não duplica).</div>`;
}
function gerarPagamentos(itens) {
  const total = itens.reduce((a, i) => a + i.valor, 0), fotos = itens.map(i => ({ ...i.x }));
  janela(itens.length > 1 ? `Gerar ${itens.length} pagamentos` : `Pagamento · ${itens[0].fl.nome}`, `<p>${itens.map(i => `${esc(i.fl.nome)} · ${ESC.dm(i.x.data)} · ${esc(nomeUnidade(i.un))} · <b>${reais(i.valor)}</b>`).join('<br>')}</p>
    <div class="form-grade"><label class="c4">Vencimento<input name="venc" type="date" class="campo" value="${hojeISO()}"></label></div>
    <div class="form-nota">Total ${reais(total)}. Cada diária vira uma conta a pagar; ao confirmar, o sistema relê cada diária e não gera se ela mudou.</div>`, 'Gerar', async f => {
    if (!f.venc.value) return 'Informe o vencimento.';
    await ESC.garantirPagar();
    const erros = [];
    for (const foto of fotos) { const e = await ESC.gerarPagamento(foto, f.venc.value); if (e) erros.push(`${ESC.freelancer(foto.freelancer_id).nome} ${ESC.dm(foto.data)}: ${e}`); }
    return erros.join(' · ');
  });
}

/* ---------- Cadastro de freelancers ---------- */
function abaCadastro() {
  const de = filtro.de || '0000', ate = filtro.ate || '9999';
  const fs = ESC.freelancers().filter(f => casaBusca([f.nome, f.funcao, f.telefone].join(' '), filtro.busca)).sort((a, b) => a.nome.localeCompare(b.nome));
  const doPer = f => ESC.diarias().filter(x => x.freelancer_id === f.id && x.data >= de && x.data <= ate && ESC.valeDiaria(x) && noFiltro(filtro, { empresa: UNIDADE_EMPRESA[ESC.unCod(x.unidade_id)], unidade: ESC.unCod(x.unidade_id) }));
  $('kpis').innerHTML = kpis([['Freelancers ativos', fs.filter(f => f.ativo).length, `${fs.length} cadastrado(s)`],
    ['Chamados no período', fs.filter(f => doPer(f).length).length, 'com ao menos 1 diária'],
    ['Diária média', reais(fs.filter(f => f.diaria > 0).reduce((a, f, _, l) => a + f.diaria / l.length, 0)), 'valor de referência']]);
  return `<section class="cartao"><div class="cartao-cab"><h2>Freelancers</h2><span class="dir"><button type="button" class="btn btn-mini" data-novofreela>+ Novo freelancer</button></span></div>
    <div class="rolagem"><table class="tabela clicavel"><thead><tr><th>Nome</th><th>Função</th><th>Telefone</th><th>Pix</th><th class="num">Diária</th><th class="num">Diárias no período</th><th class="num">Valor no período</th></tr></thead><tbody>
    ${fs.map(f => { const l = doPer(f); return `<tr data-freela="${f.id}" tabindex="0"${f.ativo ? '' : ' class="inativa"'}><td><b>${esc(f.nome)}</b></td><td>${esc(f.funcao) || '—'}</td><td>${esc(f.telefone) || '—'}</td><td>${esc(f.pix) || '—'}</td>
      <td class="num">${reais(f.diaria)}</td><td class="num">${l.length}</td><td class="num">${reais(l.reduce((a, x) => a + Number(x.valor || 0), 0))}</td></tr>`; }).join('') || '<tr><td colspan="7" class="vazio">Nenhum freelancer cadastrado.</td></tr>'}</tbody></table></div></section>`;
}
function editarFreela(fl) {
  const foto = fl ? { ...fl } : null, x = fl || { nome: '', cpf: '', telefone: '', pix: '', funcao: '', diaria: 0, ativo: true, obs: '' };
  janela(fl ? fl.nome : 'Novo freelancer', `<div class="form-grade">
    <label class="c8">Nome completo *<input name="nome" class="campo" maxlength="80" value="${esc(x.nome)}"></label>
    <label class="c4">CPF<input name="cpf" class="campo" inputmode="numeric" maxlength="14" value="${esc(fmtDoc(x.cpf || ''))}"></label>
    <label class="c4">Telefone<input name="tel" class="campo" maxlength="20" value="${esc(x.telefone)}"></label>
    <label class="c8">Chave Pix<input name="pix" class="campo" maxlength="80" value="${esc(x.pix)}"></label>
    <label class="c4">Função<input name="funcao" class="campo" maxlength="40" value="${esc(x.funcao)}" placeholder="Ex.: Ajud. cozinha"></label>
    <label class="c4">Diária (R$)<input name="diaria" class="campo" inputmode="decimal" value="${numero(x.diaria, 2)}"></label>
    <label class="c4 marcar"><input type="checkbox" name="ativo"${x.ativo ? ' checked' : ''}> Ativo</label>
    <label class="c12">Observação<input name="obs" class="campo" maxlength="200" value="${esc(x.obs)}"></label></div>`, 'Salvar', async f => {
    const cpf = f.cpf.value.replace(/\D/g, ''), diaria = Number(f.diaria.value.replace(/\./g, '').replace(',', '.') || 0);
    if (f.nome.value.trim().length < 2) return 'Informe o nome.';
    if (cpf && cpf.length !== 11) return 'CPF com 11 números (ou deixe em branco).';
    if (!(diaria >= 0)) return 'Diária inválida.';
    if (foto) { const m = mudouDesde(foto, ESC.freelancers().find(y => y.id === fl.id), ['atualizado_em'], 'Este cadastro'); if (m) return m; }
    return ESC.salvar('freelancers', { nome: f.nome.value.trim(), cpf: cpf || null, telefone: f.tel.value.trim(), pix: f.pix.value.trim(), funcao: f.funcao.value.trim(), diaria, ativo: f.ativo.checked, obs: f.obs.value.trim() }, foto);
  });
}

const kpis = l => l.map(([t, v, c]) => `<div class="kpi"><div class="kpi-tit">${t}</div><div class="kpi-valor">${v}</div><div class="kpi-ctx">${c || ''}</div></div>`).join('');
function desenhar() {
  $('abas').querySelectorAll('button').forEach(b => b.classList.toggle('ativa', b.dataset.aba === aba));
  $('conteudo').innerHTML = { faltas: abaFaltas, diarias: abaDiarias, cadastro: abaCadastro }[aba]();
}
$('abas').onclick = e => { const b = e.target.closest('[data-aba]'); if (b) { aba = b.dataset.aba; desenhar(); } };
$('btnNovo').onclick = () => ESC.janelaDiaria(null, { unidade: filtro.unidade || 'loja1' });
$('conteudo').onclick = e => {
  const t = e.target;
  if (t.closest('[data-pagartodas]')) return gerarPagamentos(aPagar(diarias()));
  if (t.closest('[data-pagar]')) { const id = t.closest('[data-pagar]').dataset.pagar; return gerarPagamentos(diarias().filter(i => i.x.id === id)); }
  if (t.closest('[data-diaria]')) return ESC.janelaDiaria(ESC.diarias().find(x => x.id === t.closest('[data-diaria]').dataset.diaria));
  if (t.closest('[data-novofreela]')) return editarFreela(null);
  if (t.closest('[data-freela]')) return editarFreela(ESC.freelancers().find(x => x.id === t.closest('[data-freela]').dataset.freela));
};
$('conteudo').onkeydown = e => { if (e.key === 'Enter' && e.target.matches('tr[tabindex]')) e.target.click(); };
$('btnExportar').onclick = () => aba === 'faltas'
  ? exportarCSV('faltas', ['Empresa', 'Unidade', 'Dia', 'Colaborador', 'Cargo', 'Tipo', 'Observação', 'Coberto por', 'Desconto do dia'],
      faltas().map(i => [nomeEmpresa(i.empresa), nomeUnidade(i.unidade), dataBR(i.x.data + 'T12:00'), i.c.nome, nomeCargo(i.c), ESC.NOME[i.x.tipo], i.x.obs, i.cob.map(d => ESC.freelancer(d.freelancer_id).nome).join(', '), numero(i.desconto, 2)]))
  : exportarCSV('diarias-freelancer', ['Empresa', 'Unidade', 'Dia', 'Freelancer', 'Função', 'Entrada', 'Saída', 'Motivo', 'Cobre', 'Valor', 'Situação', 'Pagamento'],
      diarias().map(i => [nomeEmpresa(i.empresa), nomeUnidade(i.un), dataBR(i.x.data + 'T12:00'), i.fl.nome, i.x.funcao, ESC.hm(i.x.entrada), ESC.hm(i.x.saida), ESC.MOTIVOS[i.x.motivo],
        i.x.cobre_colaborador_id ? colab(i.x.cobre_colaborador_id).nome : '', numero(i.valor, 2), ESC.SITUACOES[i.x.situacao], i.conta ? (i.conta.pago ? 'pago' : 'a pagar') : '']));
ESC.aoGravar = desenhar;
vigiarDados(['colaboradores', 'escala_dias', 'escala_padrao', 'escala_funcionamento', 'freelancers', 'freela_diarias', 'contas_pagar', 'ferias', 'unidades'], desenhar);
desenhar();
ESC.garantirPagar().then(desenhar).catch(e => console.warn('Contas a pagar:', e.message));
</script>
</body>
</html>
