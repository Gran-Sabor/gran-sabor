<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colaboradores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/estilo.css?v=11">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js?v=2"></script>
<script src="../assets/js/banco.js?v=1"></script>
<script src="../assets/js/menu.js?v=10"></script>
<script src="../assets/js/icones.js?v=1"></script>
<script src="../assets/js/tela.js?v=5"></script>
<script src="../assets/js/exemplo.js?v=9"></script>
<script src="../assets/js/folha.js?v=3"></script>
<script src="../assets/js/escala.js?v=1"></script>
<script src="../assets/js/cadastro.js?v=5"></script>
<script>
/* Colaboradores: a empresa (CNPJ) que registra vem da unidade. Salário, VT e dependentes alimentam direto a folha,
   o adiantamento, o 13º, as férias e a escala. Com o banco, grava na tabela colaboradores e todas as abas veem na hora.
   Importar planilha: colunas Unidade (ADM, S1, S2, S3, Loja 1...), Cargo, Nome, Admissão, Salário e, se tiver,
   Situação, CPF, Pix, Turno, VT. Mesmo nome na mesma unidade = atualiza; senão, inclui. */
const REAL = ESC.REAL;
const SIT = { ativo: ['ativo', 'completa'], ferias: ['em férias', 'destaque'], afastado: ['afastado', 'pendente'], desligado: ['desligado', ''] };
const tempoCasa = d => { const m = Math.floor((new Date() - new Date(d + 'T12:00')) / 2629746e3); return m < 12 ? `${m} m` : `${Math.floor(m / 12)} a ${m % 12} m`; };
const nomeCargo = v => CARGOS[v] || v;
const proxMatricula = () => String(Math.max(0, ...COLABORADORES.map(c => +c.matricula || 0)) + 1).padStart(4, '0');
const campoAdm = REAL ? 'admissaoInformada' : 'admissao';
// Com o banco, a admissão vazia aparece vazia no formulário (a folha usa o mês cheio enquanto isso)
if (REAL) COLABORADORES.forEach(c => c.admissaoInformada = c.semAdmissao ? '' : c.admissao);
const linhaBanco = d => ({ nome: d.nome, matricula: d.matricula, cpf: d.cpf || null, cargo: d.cargo, unidade_id: ESC.unId(d.unidade), admissao: d[campoAdm] || null,
  salario: d.salario, vt: d.vt || 0, optante_vt: !!d.optanteVT, dependentes: d.dependentes || 0, turno: d.turno, situacao: d.situacao, pix: d.pix || '' });

montarCadastro({
  titulo: 'Colaboradores', sub: 'Cadastro de funcionários · a empresa que registra vem da unidade',
  novoRotulo: 'Novo colaborador', tituloLista: 'Colaboradores por unidade',
  dados: COLABORADORES, tabela: 'colaboradores', depende: ['ferias', 'escala_turnos', 'unidades'],
  aviso: REAL ? '' : (db ? '<div class="aviso">A tabela de colaboradores ainda não está no banco: a lista abaixo é de exemplo.</div>' : ''),
  escopo: l => ({ empresa: l.empresa, unidade: l.unidade }),
  agrupar: l => `${nomeUnidade(l.unidade)} · ${nomeEmpresa(l.empresa)}`,
  buscaDica: 'Nome, matrícula, cargo… (atalho: /)',
  abas: [{ nome: 'Ativos', filtro: l => l.situacao !== 'desligado' }, { nome: 'Em férias ou afastados', filtro: l => ['ferias', 'afastado'].includes(l.situacao) },
         { nome: 'Desligados', filtro: l => l.situacao === 'desligado' }, { nome: 'Todos', filtro: () => true }],
  colunas: [
    { campo: 'matricula', titulo: 'Matr.', fmt: v => `<span class="mono">${esc(v)}</span>` },
    { campo: 'nome', titulo: 'Nome', fmt: v => `<b>${esc(v)}</b>` },
    { campo: 'cargo', titulo: 'Cargo', fmt: v => esc(nomeCargo(v)), busca: l => nomeCargo(l.cargo) },
    { campo: 'admissao', titulo: 'Admissão', fmt: (v, l) => l.semAdmissao ? '<span class="etiqueta pendente">não informada</span>' : `${dataBR(v + 'T12:00')} <small class="sub">${tempoCasa(v)}</small>`,
      csv: l => l.semAdmissao ? '' : dataBR(l.admissao + 'T12:00') },
    { campo: 'salario', titulo: 'Salário', num: true, fmt: v => reais(v), csv: l => numero(l.salario, 2) },
    { campo: 'turno', titulo: 'Turno', fmt: v => esc(TURNOS[v]?.[0] || v) },
    { campo: 'situacao', titulo: 'Situação', fmt: v => `<span class="etiqueta ${SIT[v]?.[1] || ''}">${SIT[v]?.[0] || v}</span>` }
  ],
  kpis: v => {
    const at = v.filter(c => c.situacao !== 'desligado');
    return [
      ['Colaboradores', at.length, EMPRESAS.map(e => `${e.nome.replace('Empresa ', 'E')}: ${at.filter(c => c.empresa === e.id).length}`).join(' · ')],
      ['Folha base (salários)', reais(at.reduce((a, c) => a + c.salario, 0)), EMPRESAS.map(e => `${e.nome.replace('Empresa ', 'E')}: ${numero(at.filter(c => c.empresa === e.id).reduce((a, c) => a + c.salario, 0), 0)}`).join(' · ')],
      ['Em férias / afastados', `${at.filter(c => c.situacao === 'ferias').length} / ${at.filter(c => c.situacao === 'afastado').length}`, 'não entram na escala'],
      ['Sem data de admissão', `<span class="${at.some(c => c.semAdmissao) ? 'desce' : ''}">${at.filter(c => c.semAdmissao).length}</span>`, 'férias e 13º precisam dela']
    ];
  },
  campos: [
    { campo: 'nome', titulo: 'Nome completo', obrig: true, larg: 'c8', max: 80, secao: 'Pessoal' },
    { campo: 'matricula', titulo: 'Matrícula', obrig: true, larg: 'c4', max: 6, somenteLeitura: true, secao: 'Pessoal' },
    { campo: 'cpf', titulo: 'CPF', tipo: 'doc', larg: 'c4', max: 14, secao: 'Pessoal' },
    { campo: 'dependentes', titulo: 'Dependentes (IR)', tipo: 'numero', larg: 'c4', secao: 'Pessoal' },
    { campo: 'pix', titulo: 'Chave Pix para pagamento', larg: 'c4', max: 80, dica: 'CPF, celular ou e-mail', secao: 'Pessoal' },
    { campo: 'unidade', titulo: 'Unidade', tipo: 'select', opcoes: () => UNIDADES.filter(u => u.id !== 'todas').map(u => [u.id, `${u.nome} · ${nomeEmpresa(UNIDADE_EMPRESA[u.id])}`]), larg: 'c6', secao: 'Contrato' },
    { campo: 'cargo', titulo: 'Cargo', tipo: 'select', opcoes: item => [...Object.entries(CARGOS), ...(item.cargo && !CARGOS[item.cargo] ? [[item.cargo, item.cargo]] : [])], larg: 'c6', secao: 'Contrato' },
    { campo: campoAdm, titulo: 'Admissão', tipo: 'data', obrig: !REAL, larg: 'c4', secao: 'Contrato' },
    { campo: 'salario', titulo: 'Salário (R$)', tipo: 'dinheiro', obrig: true, larg: 'c4', secao: 'Contrato' },
    { campo: 'turno', titulo: 'Turno padrão', tipo: 'select', opcoes: () => Object.entries(TURNOS).filter(([k]) => k !== 'F').map(([k, [n, h]]) => [k, `${n} ${h}`]), larg: 'c4', secao: 'Contrato' },
    { campo: 'vt', titulo: 'Vale-transporte por dia (R$)', tipo: 'dinheiro', larg: 'c4', dica: '0 = não usa', secao: 'Benefícios' },
    { campo: 'optanteVT', titulo: 'Optante do VT (desconta até 6%)', tipo: 'check', larg: 'c8', secao: 'Benefícios' },
    { campo: 'situacao', titulo: 'Situação', tipo: 'select', opcoes: Object.entries(SIT).map(([k, [n]]) => [k, n]), larg: 'c4', secao: 'Benefícios' }
  ],
  novo: f => ({ unidade: f.unidade || 'loja1', cargo: 'atendente', turno: 'M', situacao: 'ativo', [campoAdm]: hojeISO(), dependentes: 0, vt: 0, optanteVT: false, ativo: true, matricula: proxMatricula() }),
  validar: (d, item) => {
    if (d[campoAdm] && !/^\d{4}-\d{2}-\d{2}$/.test(d[campoAdm])) return 'Admissão inválida.';
    if (!(d.salario > 0)) return 'Informe o salário.';
    if (d.cpf && d.cpf.length !== 11) return 'CPF com 11 números (ou deixe em branco).';
    d.empresa = UNIDADE_EMPRESA[d.unidade]; d.ativo = d.situacao !== 'desligado'; d.matricula = d.matricula || item.matricula; d.dependentes = d.dependentes || 0; d.vt = d.vt || 0;
    return '';
  },
  gerarId: d => 'c' + d.matricula,
  salvar: REAL ? async (d, item) => {
    const linha = linhaBanco(d);
    if (!item) { const { error } = await db.from('colaboradores').insert(linha); if (error) return error.code === '23505' ? 'Esta matrícula já existe (alguém cadastrou agora?). Feche e abra de novo.' : error.message; }
    else {
      const { data, error } = await db.from('colaboradores').update(linha).eq('id', item.id).eq('atualizado_em', item.atualizado_em).select('id');
      if (error) return error.message;
      if (!data.length) { await casca().dadosBanco.gravou('colaboradores'); return 'Este cadastro mudou em outra tela enquanto você editava. Nada foi gravado: confira o valor novo.'; }
    }
    await casca().dadosBanco.gravou('colaboradores'); return '';
  } : null,
  rodapeForm: () => 'A empresa que registra é a da unidade. Mudou o salário? Holerite, adiantamento, 13º e férias recalculam sozinhos. Folgas: Configuração da escala.'
});
if (REAL) vigiarDados(['colaboradores'], () => COLABORADORES.forEach(c => c.admissaoInformada = c.semAdmissao ? '' : c.admissao));
if (REAL) janela.nota = 'Grava no banco';

/* ---------- Importar planilha (folha do mês, planilha do contador...) ---------- */
document.querySelector('.tela-cab .dir').insertAdjacentHTML('afterbegin', '<button type="button" class="btn" id="btnImportar" title="CSV ou Excel: Unidade, Cargo, Nome, Admissão, Salário">Importar planilha</button>');
const chave = s => normalizar(s).replace(/[^a-z0-9]+/g, ' ').trim();
const UN_APELIDOS = { adm: 'escritorio', rateio: 'escritorio', escritorio: 'escritorio', s1: 'loja1', gs1: 'loja1', s2: 'loja2', gs2: 'loja2', s3: 'loja3', gs3: 'loja3', central: 'central' };
const unidadeDe = t => { const k = chave(t).replace(/\s/g, ''); return UN_APELIDOS[k] || (UNIDADES.find(u => u.id !== 'todas' && (chave(u.nome).replace(/\s/g, '') === k || u.id === k)) || {}).id || ''; };
const CARGO_APELIDOS = { 'op de caixa': 'caixa', 'operador de caixa': 'caixa', 'operadora de caixa': 'caixa', caixa: 'caixa', cozinheira: 'cozinheiro', cozinheiro: 'cozinheiro',
  'ajud cozinha': 'aux_cozinha', 'ajudante de cozinha': 'aux_cozinha', 'aux cozinha': 'aux_cozinha', 'auxiliar de cozinha': 'aux_cozinha', acougueiro: 'acougueiro', 'assist financeiro': 'assist_financeiro',
  'assistente financeiro': 'assist_financeiro', 'sub gerente': 'subgerente', subgerente: 'subgerente', 'lider cozinha': 'lider_cozinha', 'lider de cozinha': 'lider_cozinha', churrasqueiro: 'churrasqueiro',
  motoboy: 'motoboy', comprador: 'comprador', diretoria: 'diretoria', diretor: 'diretoria', atendente: 'atendente', motorista: 'motorista' };
const cargoDe = (t, un) => { const k = chave(t); if (k === 'gerente') return un === 'escritorio' ? 'gerente' : 'gerente_loja';
  return CARGO_APELIDOS[k] || Object.keys(CARGOS).find(x => chave(CARGOS[x]) === k || x === k) || String(t).trim().slice(0, 40); };
const numBR = x => { if (typeof x === 'number') return x; let s = String(x ?? '').replace(/[R$\s]/g, ''); if (!s) return NaN; if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, ''); return Number(s); };
const dataDe = x => { if (x == null || x === '') return ''; if (typeof x === 'number') { const d = new Date(Math.round((x - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const s = String(x).trim(); let m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s); if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? m[0] : 'inválida'; };
const SIT_APELIDOS = { ativo: 'ativo', afastado: 'afastado', afast: 'afastado', ferias: 'ferias', desligado: 'desligado' };
async function lerArquivo(arq) {
  if (/\.csv$|\.txt$/i.test(arq.name)) {
    const txt = (await arq.text()).replace(/^﻿/, ''), linhas = txt.split(/\r?\n/).filter(l => l.trim()), sep = (linhas[0].match(/;/g) || []).length >= (linhas[0].match(/,/g) || []).length ? ';' : ',';
    const cel = l => l.split(sep).map(x => x.replace(/^"|"$/g, '').trim());
    const cab = cel(linhas[0]); return linhas.slice(1).map(l => Object.fromEntries(cel(l).map((v, i) => [cab[i], v])));
  }
  if (!window.XLSX) await new Promise((ok, falha) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => falha(new Error('sem internet para abrir o Excel')); document.head.appendChild(s); });
  const wb = XLSX.read(await arq.arrayBuffer()); return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
}
function interpretar(regs) {
  const col = (r, ...nomes) => { const k = Object.keys(r).find(x => nomes.some(n => chave(x).startsWith(n))); return k ? r[k] : ''; };
  let prox = Math.max(0, ...COLABORADORES.map(c => +c.matricula || 0));
  return regs.map(r => {
    const nome = String(col(r, 'nome', 'colaborador')).trim(); if (!nome) return null;
    const un = unidadeDe(col(r, 'unidade', 'loja', 'setor')), cargo = cargoDe(col(r, 'cargo', 'funcao'), un), salario = numBR(col(r, 'salario', 'base salarial'));
    const admissao = dataDe(col(r, 'admissao')), sit = SIT_APELIDOS[chave(col(r, 'situacao')).split(' ')[0]] || 'ativo';
    const cpf = String(col(r, 'cpf')).replace(/\D/g, ''), turno = String(col(r, 'turno')).trim().toUpperCase(), vt = numBR(col(r, 'vt', 'vale transporte'));
    const erro = !un ? 'unidade não reconhecida' : !(salario > 0) ? 'salário inválido' : admissao === 'inválida' ? 'admissão inválida' : cpf && cpf.length !== 11 ? 'CPF inválido' : '';
    const atual = COLABORADORES.find(c => chave(c.nome) === chave(nome) && c.unidade === un);
    const d = { nome, unidade: un, cargo, salario, situacao: sit, ...(admissao ? { [campoAdm]: admissao } : {}), ...(cpf ? { cpf } : {}), ...(TURNOS[turno] && turno !== 'F' ? { turno } : {}), ...(vt >= 0 ? { vt, optanteVT: vt > 0 } : {}) };
    const muda = atual ? Object.keys(d).filter(k => String(atual[k] ?? '') !== String(d[k] ?? '')) : [];
    return { d, atual, erro, muda, matricula: atual ? atual.matricula : String(++prox).padStart(4, '0') };
  }).filter(Boolean);
}
$('btnImportar').onclick = () => {
  let itens = [];
  const v = janela('Importar colaboradores', `<div class="form-grade"><label class="c12">Planilha (CSV ou Excel)<input type="file" name="arq" class="campo" accept=".csv,.txt,.xlsx,.xls"></label></div>
    <div id="previaImp" class="form-nota">Colunas: Unidade (ADM/Rateio = Escritório, S1/GS1 = Loja 1...), Cargo, Nome, Admissão, Salário e, se tiver, Situação, CPF, Pix, Turno, VT. O mesmo nome na mesma unidade é atualizado; os outros entram como novos.</div>`, 'Importar', async () => {
    const ok = itens.filter(i => !i.erro && (!i.atual || i.muda.length));
    if (!ok.length) return 'Nada para importar (escolha a planilha; linhas com erro ou sem mudança ficam de fora).';
    const novos = ok.filter(i => !i.atual), alterados = ok.filter(i => i.atual);
    if (REAL) {
      if (novos.length) { const { error } = await db.from('colaboradores').insert(novos.map(i => linhaBanco({ turno: 'M', situacao: 'ativo', vt: 0, optanteVT: false, dependentes: 0, ...i.d, matricula: i.matricula }))); if (error) return 'Não foi possível incluir: ' + error.message; }
      const falhas = [];
      for (const i of alterados) { const { data, error } = await db.from('colaboradores').update(linhaBanco({ ...i.atual, ...i.d })).eq('id', i.atual.id).eq('atualizado_em', i.atual.atualizado_em).select('id'); if (error || !data.length) falhas.push(i.d.nome); }
      await casca().dadosBanco.gravou('colaboradores');
      return falhas.length ? `Importado, menos: ${falhas.join(', ')} (mudaram em outra tela; importe de novo).` : '';
    }
    novos.forEach(i => COLABORADORES.push({ id: 'c' + i.matricula, matricula: i.matricula, turno: 'M', vt: 0, optanteVT: false, dependentes: 0, pix: '', jornada: '44h semanais', admissao: hojeISO(), ...i.d, empresa: UNIDADE_EMPRESA[i.d.unidade], ativo: i.d.situacao !== 'desligado' }));
    alterados.forEach(i => Object.assign(i.atual, i.d, { empresa: UNIDADE_EMPRESA[i.d.unidade], ativo: i.d.situacao !== 'desligado' }));
    avisarMudanca('colaboradores'); location.reload(); return '';
  });
  v.querySelector('[name=arq]').onchange = async e => {
    const arq = e.target.files[0]; if (!arq) return;
    try { itens = interpretar(await lerArquivo(arq)); } catch (x) { $('previaImp').textContent = 'Não consegui ler: ' + x.message; return; }
    const st = i => i.erro ? `<span class="etiqueta perigo">${esc(i.erro)}</span>` : !i.atual ? '<span class="etiqueta completa">novo</span>' : i.muda.length ? `<span class="etiqueta pendente">atualiza ${esc(i.muda.join(', '))}</span>` : '<span class="sub">sem mudança</span>';
    $('previaImp').innerHTML = `<b>${itens.filter(i => !i.erro && !i.atual).length} novo(s), ${itens.filter(i => i.atual && i.muda.length && !i.erro).length} atualizado(s), ${itens.filter(i => i.erro).length} com erro.</b>
      <div class="rolagem" style="max-height:300px;margin-top:6px"><table class="tabela"><thead><tr><th>Nome</th><th>Unidade</th><th>Cargo</th><th>Admissão</th><th class="num">Salário</th><th></th></tr></thead><tbody>
      ${itens.map(i => `<tr><td>${esc(i.d.nome)}</td><td>${esc(nomeUnidade(i.d.unidade))}</td><td>${esc(nomeCargo(i.d.cargo))}</td><td>${i.d[campoAdm] && i.d[campoAdm] !== 'inválida' ? dataBR(i.d[campoAdm] + 'T12:00') : '—'}</td><td class="num">${numero(i.d.salario, 2)}</td><td>${st(i)}</td></tr>`).join('')}</tbody></table></div>`;
  };
};
</script>
</body>
</html>
