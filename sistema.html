<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b4532a">
<title>Gran Sabor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilo.css?v=3">
</head>
<body>
<div class="casca">
  <header class="topo">
    <button type="button" class="btn btn-ico so-celular" id="btnMenu" aria-label="Abrir menu"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="marca"><span class="marca-logo">GS</span><span class="marca-nome">Gran Sabor</span></div>
    <div class="topo-meio">
      <select id="unidade" class="campo seletor-unidade" aria-label="Unidade"></select>
    </div>
    <div class="topo-dir">
      <button type="button" class="btn btn-ico sino" id="btnAlertas" aria-label="Pontos de atenção">
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        <span class="contador oculto" id="contAlertas"></span></button>
      <div class="usuario"><span class="avatar" id="avatar"></span><span class="nome" id="usuarioNome"></span>
        <button type="button" class="btn btn-ico" id="btnSair" aria-label="Sair" title="Sair"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button></div>
    </div>
  </header>
  <nav class="menu" aria-label="Menu">
    <div class="menu-busca"><input type="search" id="buscaMenu" class="campo" placeholder="Procurar tela…" aria-label="Procurar tela"></div>
    <div id="menuLista"></div>
  </nav>
  <div class="abas" id="abas" role="tablist" aria-label="Telas abertas"></div>
  <main class="area" id="area"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/icones.js?v=1"></script>
<script src="assets/js/menu.js?v=2"></script>
<script src="assets/js/sistema.js?v=4"></script>
</body>
</html>
