name: Conferir conexão com o banco

# Só confere se as 3 chaves do Supabase cadastradas no GitHub funcionam.
# Não cria nem altera nada no banco.
on:
  pull_request:
    paths: [".github/workflows/conferir-conexao.yml"]
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ID_PROJETO: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: 1. Chaves cadastradas
        run: |
          falta=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && falta="$falta SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && falta="$falta SUPABASE_DB_PASSWORD"
          [ -z "$ID_PROJETO" ] && falta="$falta SUPABASE_PROJECT_ID"
          if [ -n "$falta" ]; then echo "::error::Faltando:$falta"; exit 1; fi
          case "$SUPABASE_ACCESS_TOKEN" in sbp_*) ;; *) echo "::error::SUPABASE_ACCESS_TOKEN não começa com sbp_ (deve ser o token, não a senha)"; exit 1;; esac
          if [ "$SUPABASE_ACCESS_TOKEN" = "$SUPABASE_DB_PASSWORD" ]; then echo "::error::A senha do banco está igual ao token"; exit 1; fi
          echo "Três chaves cadastradas."
      - name: 2. ID do projeto
        run: |
          ref=$(printf '%s' "$ID_PROJETO" | tr -d '[:space:]' | grep -oE '[a-z]{20}' | head -n1 || true)
          if [ -z "$ref" ]; then
            echo "::error::SUPABASE_PROJECT_ID não tem um ID válido (20 letras minúsculas). Ele tem ${#ID_PROJETO} caracteres."
            exit 1
          fi
          if [ "$ref" != "sayplpvhnoeytfnkbvpm" ]; then
            echo "::error::SUPABASE_PROJECT_ID tem um ID, mas não é o do projeto Sistema Gran Sabor (sayplpvhnoeytfnkbvpm)."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_ENV"
          echo "ID do projeto certo."
      - name: 3. Token
        run: |
          codigo=$(curl -s -o /tmp/resp.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$ref")
          echo "Resposta da API do Supabase para o projeto: HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            echo "Projetos que este token enxerga:"
            curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects | grep -oE '"(id|name)":"[^"]*"' || true
            echo "::error::O token não abre o projeto (HTTP $codigo). Confira se o token foi gerado para o projeto Sistema Gran Sabor."
            exit 1
          fi
          supabase link --project-ref "$ref" --password "$SUPABASE_DB_PASSWORD" \
            || { echo "::error::O token abre o projeto pela API, mas a ferramenta do Supabase não conseguiu ligar."; exit 1; }
          echo "Token aceito."
      - name: 4. Senha do banco
        run: |
          supabase migration list --password "$SUPABASE_DB_PASSWORD" \
            || { echo "::error::O banco recusou a senha (confira SUPABASE_DB_PASSWORD)"; exit 1; }
          echo "Senha do banco aceita. Tudo certo."
